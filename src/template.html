<style>

<body>
<div id="app">
  <header>
    <div class="hd-top">
      <h1>省间路径优选测算</h1>
      <span class="badge" id="verBadge">真实数据 · 2026 第四监管周期</span>
    </div>
  </header>
  <main>
    <section id="v-calc"></section>
    <section id="v-map" hidden></section>
    <section id="v-lib" hidden></section>
  </main>
  <nav>
    <button id="t-calc" class="on" onclick="go('calc')">
      <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l4-5 3 3 5-7"/><path d="M3 17h14"/></svg>测算</button>
    <button id="t-map" onclick="go('map')">
      <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5l4.5-2 5 2 4.5-2v11l-4.5 2-5-2-4.5 2z"/><path d="M7.5 3.5v11M12.5 5.5v11"/></svg>网架图</button>
    <button id="t-lib" onclick="go('lib')">
      <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 8h14M8 8v9"/></svg>费率库</button>
  </nav>
</div>
<script>
'use strict';
/*__DATA__*/
const BUILD_TIME='__BUILD_TIME__';

const PV=DATA.PV, ST=DATA.ST, SEC=DATA.SEC, RG=DATA.RG;
let CH=DATA.CH.map(c=>({...c}));

const REGION_OF={BJ:'华北',TJ:'华北',HE:'华北',SX:'华北',SD:'华北',NM:'华北',
 SH:'华东',JS:'华东',ZJ:'华东',AH:'华东',FJ:'华东',
 HB:'华中',HN:'华中',HA:'华中',JX:'华中',CQ:'华中',SC:'华中',XZ:'华中',
 LN:'东北',JL:'东北',HL:'东北',
 SN:'西北',GS:'西北',QH:'西北',NX:'西北',XJ:'西北',
 GD:'南方',GX:'南方',YN:'南方',GZ:'南方'};

const LS_LIB='iproute.v2.lib', LS_LAST='iproute.v2.last', LS_MAP='iproute.v2.map';

let state={
  from:'SC', to:'JS', qty:1000, hours:1,
  pGen:320, pDst:450, pNet:112, fund:26.6,
  lossBearer:1, K:6, maxHops:3, maxDetour:2.0,
  includeRegion:true,
  mapProvider:'qq', tiandituKey:''
};
let stored=null;

const N=k=>PV[k]?PV[k].n:k;
const fmt=(v,d=1)=>(v===null||v===undefined||isNaN(v))?'—':Number(v).toFixed(d);
const num=v=>(v===null||v===undefined||isNaN(v))?'—':Math.round(v).toLocaleString('zh-CN');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIER={gov:'发改委核定',grid:'国网披露',region:'区域/送出省口径',est:'待补'};
const tierTag=t=>`<span class="tier ${t}">${TIER[t]||t}</span>`;

function stName(id){ return id&&ST[id]?ST[id].n:null; }
function stAddr(id){ return id&&ST[id]?ST[id].a:null; }
function stLngLat(id){ return id&&ST[id]?[ST[id].lng,ST[id].lat]:null; }
function provLngLat(p){ return PV[p]?[PV[p].lng,PV[p].lat]:null; }
function lngLatOf(ch,side){
  const s = side==='from'?ch.stFrom:ch.stTo;
  const c = side==='from'?ch.from:ch.to;
  return (s&&ST[s]) ? [ST[s].lng,ST[s].lat] : provLngLat(c);
}
function regionFee(ch){
  if(!state.includeRegion) return 0;
  const rf=REGION_OF[ch.from], rt=REGION_OF[ch.to];
  if(!rf||!rt||rf===rt) return 0;
  return (RG[rt]||0)*1000;   // 元/kWh → 元/MWh
}

/* ================= 算法 ================= */
function buildAdj(edges){
  const adj={};
  edges.forEach(e=>{ (adj[e.from]||(adj[e.from]=[])).push({to:e.to,e}); (adj[e.to]||(adj[e.to]=[])).push({to:e.from,e}); });
  return adj;
}
function approxW(e){ return e.t+(e.loss||0)/100*state.pGen+regionFee(e); }
function dijkstra(adj,src,dst,bannedE,bannedN){
  if(src===dst) return {edges:[],nodes:[src],cost:0};
  const dist={src:0}, prev={}, seen={}, Q=[src];
  while(Q.length){
    let bi=0; for(let i=1;i<Q.length;i++) if(dist[Q[i]]<dist[Q[bi]]) bi=i;
    const u=Q.splice(bi,1)[0]; if(seen[u]) continue; seen[u]=true;
    if(u===dst) break;
    for(const {to,e} of (adj[u]||[])){
      if(seen[to]||bannedE.has(e.id)||bannedN.has(to)) continue;
      const nd=dist[u]+approxW(e);
      if(dist[to]===undefined||nd<dist[to]){ dist[to]=nd; prev[to]={u,e}; Q.push(to); }
    }
  }
  if(dist[dst]===undefined) return null;
  const edges=[],nodes=[dst]; let cur=dst;
  while(cur!==src){ const p=prev[cur]; if(!p) return null; edges.unshift(p.e); nodes.unshift(p.u); cur=p.u; }
  return {edges,nodes,cost:dist[dst]};
}
function keyOf(nodes){ return nodes.join('>'); }
function yenK(adj,src,dst,K){
  const first=dijkstra(adj,src,dst,new Set(),new Set());
  if(!first) return [];
  const A=[first],B=[],seen=new Set([keyOf(first.nodes)]);
  while(A.length<K){
    const prev=A[A.length-1];
    for(let i=0;i<prev.edges.length;i++){
      const spurNode=prev.nodes[i], rootE=prev.edges.slice(0,i), rootN=prev.nodes.slice(0,i+1);
      const bannedE=new Set(), bannedN=new Set();
      for(const p of A) if(p.edges.length>i && p.nodes.slice(0,i+1).join()===rootN.join()) bannedE.add(p.edges[i].id);
      for(let j=0;j<rootN.length-1;j++) bannedN.add(rootN[j]);
      const spur=dijkstra(adj,spurNode,dst,bannedE,bannedN);
      if(!spur) continue;
      const tot={edges:rootE.concat(spur.edges),nodes:rootN.concat(spur.nodes.slice(1)),
        cost:rootE.reduce((s,e)=>s+approxW(e),0)+spur.cost};
      const kk=keyOf(tot.nodes);
      if(seen.has(kk)||B.some(b=>keyOf(b.nodes)===kk)) continue;
      B.push(tot);
    }
    if(!B.length) break;
    B.sort((a,b)=>a.cost-b.cost);
    const nx=B.shift(); seen.add(keyOf(nx.nodes)); A.push(nx);
  }
  return A;
}
function distDeg(a,b){
  const dx=(a[0]-b[0])*Math.cos((a[1]+b[1])/2*Math.PI/180), dy=a[1]-b[1];
  return Math.sqrt(dx*dx+dy*dy);
}
function detourOf(nodes,edges){
  if(nodes.length<3) return 1;
  let d=0;
  for(let i=0;i<edges.length;i++){
    const a=lngLatOf(edges[i],'from'), b=lngLatOf(edges[i],'to');
    if(a&&b) d+=distDeg(a,b);
  }
  const s=distDeg(lngLatOf(edges[0],'from')||provLngLat(nodes[0]), provLngLat(nodes[nodes.length-1]));
  return s<1e-6?1:d/s;
}
function havKm(a,b){
  if(!a||!b) return 0;
  const R=6371, r=Math.PI/180;
  const dp=(b[1]-a[1])*r, dl=(b[0]-a[0])*r;
  const s=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function evalPath(path,ctx){
  const edges=path.edges, nodes=path.nodes, n=edges.length;
  const suf=new Array(n+1); suf[n]=1;
  for(let i=n-1;i>=0;i--) suf[i]=suf[i+1]*(1-(edges[i].loss||0)/100);
  const D=suf[0], genQty=1/D, lossQty=genQty-1;
  const qty=ctx.qty, h=Math.max(ctx.hours,0.25);
  const toMW=q=>qty/h*q;
  const toMWh=q=>qty*q;

  let trans=0, regFee=0, dist=0, segLossMwh=0, vsCount=0;
  const vset=new Set(), tset=new Set(), rset=new Set(), stset=new Set();
  const segs=edges.map((e,i)=>{
    const q=1/suf[i], qOut=1/suf[i+1];
    const fee=e.t*q, rg=regionFee(e)*q;
    trans+=fee; regFee+=rg;
    const a=lngLatOf(e,'from'), b=lngLatOf(e,'to');
    const crow=havKm(a,b);
    const km=e.lenKm||crow;
    const lossMwh=toMWh(q-qOut);
    segLossMwh+=lossMwh; dist+=km;
    vset.add(e.kv); tset.add(e.type); rset.add(REGION_OF[e.to]);
    if(e.stFrom) stset.add(e.stFrom); if(e.stTo) stset.add(e.stTo);
    if(e.type==='DC') vsCount++;
    return {
      e,q,qOut,fee,rg,a:nodes[i],b:nodes[i+1],
      km, crow, kmEst:!e.lenKm,
      inMW:toMW(q), outMW:toMW(qOut), lossMW:toMW(q-qOut),
      inMWh:toMWh(q), outMWh:toMWh(qOut), lossMwh,
      lossCost:lossMwh*ctx.pGen,
      feeYuan:qty*fee, rgYuan:qty*rg,
      util:e.cap? toMW(q)/e.cap : null,
      headroom:e.cap? e.cap-toMW(q) : null,
    };
  });
  const g=ctx.lossBearer;
  const cGen=ctx.pGen, cLossBuyer=cGen*g*lossQty, cTrans=trans, cReg=regFee, cNet=ctx.pNet, cFund=ctx.fund;
  const landed=cGen+cLossBuyer+cTrans+cReg+cNet+cFund;
  const netLossTotal=cGen*lossQty;
  const channelOnly=trans;
  const senderNet=ctx.pDst*D-(cTrans+cReg)*D-netLossTotal*(1-g)*D;
  const deliverMW=qty/h;
  const segLd=segs.map(s=>({name:s.e.n,mw:s.inMW,cap:s.e.cap,over:s.e.cap? s.inMW>s.e.cap : false}));
  const maxLoad=Math.max(...segLd.map(s=>s.cap?s.mw/s.cap:0));
  const overSeg=segLd.filter(s=>s.over);
  // 断面校验（段入口功率之和，与断面限额比对）
  const secHits=[];
  for(const sec of SEC){
    if(!sec.edges||!sec.edges.length) continue;
    const inSec=segs.filter(s=>sec.edges.some(k=>s.e.n.includes(k)||s.e.fn.includes(k)));
    if(!inSec.length) continue;
    const tot=inSec.reduce((a,s)=>a+s.inMW,0);
    secHits.push({sec, mw:tot, over:tot>sec.limit, util:tot/sec.limit,
      members:inSec.map(s=>s.e.n)});
  }
  const secOver=secHits.filter(h=>h.over);
  const feasible=!overSeg.length && !secOver.length;

  const genMWh=toMWh(genQty), lossMwh=toMWh(lossQty);
  const straight=havKm(lngLatOf(edges[0],'from'), lngLatOf(edges[n-1],'to'));
  const yuan={
    gen:ctx.pGen*qty,
    trans:qty*trans,
    reg:qty*regFee,
    loss:ctx.pGen*lossMwh*g,
    net:ctx.pNet*qty,
    fund:ctx.fund*qty,
  };
  yuan.total=yuan.gen+yuan.trans+yuan.reg+yuan.loss+yuan.net+yuan.fund;
  const tiers={gov:0,grid:0,region:0,est:0};
  edges.forEach(e=>{tiers[e.tier]=(tiers[e.tier]||0)+1;});
  const unverified=edges.filter(e=>e.tier!=='gov').length;

  return {nodes,edges,hops:n,D,genQty,lossQty,trans,regFee,segs,segLd,overSeg,maxLoad,secHits,secOver,feasible,
    detour:detourOf(nodes,edges), landed, channelOnly, senderNet, yuan,
    qty, h, deliverMW, genMWh, lossMwh, segLossMwh,
    dist, straight, dcCount:vsCount, acCount:n-vsCount,
    kvList:[...vset].filter(Boolean), typeList:[...tset], regionList:[...rset].filter(Boolean),
    stationList:[...stset], tiers, unverified,
    comp:{gen:cGen,loss:cLossBuyer,trans:cTrans,reg:cReg,net:cNet,fund:cFund}};
}
function solve(){
  const ctx={pGen:state.pGen,pDst:state.pDst,pNet:state.pNet,fund:state.fund,
    lossBearer:state.lossBearer,qty:state.qty,hours:state.hours};
  const adj=buildAdj(CH);
  if(!PV[state.from]||!PV[state.to]) return {err:'省份代码无效'};
  if(state.from===state.to) return {err:'送端与受端不能相同'};
  if(!adj[state.from]) return {err:N(state.from)+' 暂无接入的跨省通道'};
  const raw=yenK(adj,state.from,state.to,Math.max(state.K*4,20));
  const inHops=raw.filter(p=>p.edges.length<=state.maxHops);
  const cands=inHops.filter(p=>detourOf(p.nodes,p.edges)<=state.maxDetour).slice(0,state.K);
  if(!cands.length){
    return {err: raw.length===0 ? '未找到 '+N(state.from)+' 至 '+N(state.to)+' 的连通路径'
      : (inHops.length===0 ? '在 '+state.maxHops+' 跳以内无可行路径（最短需 '+raw[0].edges.length+' 跳），请放宽跳数'
      : '当前绕行度上限把所有候选都筛掉了，请放宽')};
  }
  const rows=cands.map(p=>evalPath(p,ctx));
  const byA=[...rows].sort((a,b)=>a.landed-b.landed);
  const byB=[...rows].sort((a,b)=>a.channelOnly-b.channelOnly);
  const byC=[...rows].sort((a,b)=>b.senderNet-a.senderNet);
  rows.forEach(r=>{r.rankA=byA.indexOf(r)+1;r.rankB=byB.indexOf(r)+1;r.rankC=byC.indexOf(r)+1;});
  rows.sort((a,b)=>a.rankA-b.rankA);
  return {rows,byA,byB,byC,n:rows.length};
}
function pathLabel(p){ return p.nodes.map(N).join(' → '); }
function routeStr(nodes){ return nodes.map((k,i)=> i===0?'<b>'+esc(N(k))+'</b>':'<span class="arw">→</span>'+esc(N(k))).join(''); }

}

function doSolve(){
  readInputs(); state._res=solve(); saveLast(); renderCalc(); window.scrollTo({top:0,behavior:'smooth'});
}
function readInputs(){
  const g=id=>document.getElementById(id);
  if(!g('i-from')) return;
  state.from=g('i-from').value; state.to=g('i-to').value;
  state.qty=+g('i-qty').value||1000; state.hours=+g('i-hours').value||1;
  state.K=Math.max(1,Math.min(10,+g('i-k').value||6));
  state.maxHops=+g('i-hops').value||3; state.maxDetour=+g('i-detour').value||2;
  state.pGen=+g('i-pgen').value||0; state.pDst=+g('i-pdst').value||0;
  state.pNet=+g('i-pnet').value||0; state.fund=+g('i-fund').value||0;
  state.lossBearer=+g('i-bearer').value;
  state.includeRegion=g('i-region').value==='1';
}
function refreshProvinceParams(){
  const f=PV[state.from], t=PV[state.to];
  if(f) state.pGen=f.clear;
  if(t){ state.pNet=t.net; state.fund=t.fund; state.pDst=t.clear; }
}

/* ================= 地图 ================= */
let map=null,mapReady=false,polyLayer=null,mkLayer=null,lbLayer=null;
let tdMap=null,tdReady=false,tdLayer=null;

const dotSvg=f=>`data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14'%3E%3Ccircle cx='7' cy='7' r='4.5' fill='${encodeURIComponent(f)}' stroke='%23ffffff' stroke-width='1.5'/%3E%3C/svg%3E`;
const D_HOT=dotSvg('#185FA5'), D_ON=dotSvg('#0F6E56'), D_BASE=dotSvg('#8A8A85');

function visibleChannels(){
  const r=state._res&&state._res.rows;
  if(!r) return {list:CH, hot:new Set(), alt:new Set(), nodes:new Set()};
  const hot=new Set(r[0].edges.map(e=>e.id));
  const alt=new Set(r[1]?r[1].edges.map(e=>e.id):[]);
  const nodes=new Set(); r.forEach(row=>row.edges.forEach(e=>{nodes.add(e.from);nodes.add(e.to);}));
  const ids=new Set([...hot,...alt]);
  return {list:CH.filter(c=>ids.has(c.id)), hot, alt, nodes};
}

function initMap(){
  if(mapReady) return true;
  if(typeof TMap==='undefined') return false;
  try{
    map=new TMap.Map('map-view',{center:new TMap.LatLng(34,108),zoom:4});
    polyLayer=new TMap.MultiPolyline({map,styles:{
      hot:new TMap.PolylineStyle({color:'#185FA5',width:5,borderWidth:1,borderColor:'#ffffff',lineCap:'round'}),
      alt:new TMap.PolylineStyle({color:'#EF9F27',width:3,borderWidth:1,borderColor:'#ffffff',lineCap:'round'}),
      base:new TMap.PolylineStyle({color:'#B4B2A9',width:1,borderWidth:0,lineCap:'round'})},geometries:[]});
    mkLayer=new TMap.MultiMarker({map,styles:{
      hot:new TMap.MarkerStyle({width:14,height:14,anchor:{x:7,y:7},src:D_HOT}),
      on:new TMap.MarkerStyle({width:16,height:16,anchor:{x:8,y:8},src:D_ON}),
      base:new TMap.MarkerStyle({width:10,height:10,anchor:{x:5,y:5},src:D_BASE})},geometries:[]});
    lbLayer=new TMap.MultiLabel({map,styles:{
      hot:new TMap.LabelStyle({color:'#0C447C',size:11,offset:{x:0,y:-13},alignment:'center'}),
      base:new TMap.LabelStyle({color:'#8A8A85',size:10,offset:{x:0,y:-10},alignment:'center'})},geometries:[]});
    mapReady=true; return true;
  }catch(e){ return false; }
}
function drawMapQQ(){
  if(!initMap()) return false;
  const v=visibleChannels();
  const polys=[],mks=[],lbs=[],seen=new Set();
  v.list.forEach(c=>{
    const a=lngLatOf(c,'from'), b=lngLatOf(c,'to'); if(!a||!b) return;
    const sid=v.hot.has(c.id)?'hot':(v.alt.has(c.id)?'alt':'base');
    polys.push({id:c.id,styleId:sid,paths:[new TMap.LatLng(a[1],a[0]),new TMap.LatLng(b[1],b[0])]});
    [['from',a],['to',b]].forEach(([side,ll])=>{
      const st=side==='from'?c.stFrom:c.stTo, pv=side==='from'?c.from:c.to;
      const key=st||pv; if(seen.has(key)) return; seen.add(key);
      const isEnd=pv===state.from||pv===state.to;
      const nm=st?stName(st):N(pv);
      mks.push({id:'m'+key,styleId:isEnd?'on':'hot',position:new TMap.LatLng(ll[1],ll[0])});
      lbs.push({id:'l'+key,styleId:isEnd?'hot':'base',position:new TMap.LatLng(ll[1],ll[0]),text:nm});
    });
  });
  Object.keys(PV).forEach(k=>{
    if(seen.has(k)) return;
    const ll=provLngLat(k);
    mks.push({id:'mp'+k,styleId:'base',position:new TMap.LatLng(ll[1],ll[0])});
    lbs.push({id:'lp'+k,styleId:'base',position:new TMap.LatLng(ll[1],ll[0]),text:N(k)});
  });
  polyLayer.setGeometries(polys); mkLayer.setGeometries(mks); lbLayer.setGeometries(lbs);
  return true;
}
function loadTianditu(cb){
  if(tdReady) return cb(true);
  if(typeof T!=='undefined'&&T.Map){ tdReady=true; return cb(true); }
  if(!state.tiandituKey){ return cb(false); }
  const s=document.createElement('script');
  s.src='https://api.tianditu.gov.cn/api?v=4.0&tk='+encodeURIComponent(state.tiandituKey);
  s.onload=()=>{ tdReady=true; cb(true); };
  s.onerror=()=>cb(false);
  document.head.appendChild(s);
}
function drawMapTD(){
  if(!tdReady) return false;
  try{
    if(!tdMap){ tdMap=new T.Map('map-view'); tdMap.centerAndZoom(new T.LngLat(108,34),5); }
    tdMap.clearOverLays();
    const v=visibleChannels(); const seen=new Set();
    v.list.forEach(c=>{
      const a=lngLatOf(c,'from'), b=lngLatOf(c,'to'); if(!a||!b) return;
      const isHot=v.hot.has(c.id), isAlt=v.alt.has(c.id);
      const line=new T.Polyline([new T.LngLat(a[0],a[1]),new T.LngLat(b[0],b[1])],
        {color:isHot?'#185FA5':(isAlt?'#EF9F27':'#B4B2A9'),weight:isHot?5:(isAlt?3:1),opacity:isHot||isAlt?0.9:0.5});
      tdMap.addOverLay(line);
      [['from',a],['to',b]].forEach(([side,ll])=>{
        const st=side==='from'?c.stFrom:c.stTo, pv=side==='from'?c.from:c.to;
        const key=st||pv; if(seen.has(key)) return; seen.add(key);
        const isEnd=pv===state.from||pv===state.to;
        const mk=new T.Marker(new T.LngLat(ll[0],ll[1]),{icon:new T.Icon({iconUrl:isEnd?D_ON:D_HOT,iconSize:new T.Point(14,14)})});
        tdMap.addOverLay(mk);
        const lb=new T.Label({text:st?stName(st):N(pv),position:new T.LngLat(ll[0],ll[1]),offset:new T.Point(0,-14)});
        tdMap.addOverLay(lb);
      });
    });
    Object.keys(PV).forEach(k=>{ if(seen.has(k)) return; const ll=provLngLat(k);
      tdMap.addOverLay(new T.Marker(new T.LngLat(ll[0],ll[1]),{icon:new T.Icon({iconUrl:D_BASE,iconSize:new T.Point(10,10)})}));
      tdMap.addOverLay(new T.Label({text:N(k),position:new T.LngLat(ll[0],ll[1]),offset:new T.Point(0,-12)}));
    });
    return true;
  }catch(e){ return false; }
}

  const isQQ=state.mapProvider==='qq';
  let out=`<div class="card tight">
    <div class="sec-title">跨省网架地图<span class="hint">合规底图</span></div>
    <div class="seg">
      <button class="${isQQ?'on':''}" onclick="switchMap('qq')">腾讯地图</button>
      <button class="${!isQQ?'on':''}" onclick="switchMap('td')">天地图</button>
    </div>`;
  if(!isQQ){
    out+=`<label class="f"><span>天地图密钥（tk）</span>
      <input id="i-tk" type="text" value="${esc(state.tiandituKey)}" placeholder="在天地图开放平台申请后粘贴到这里"></label>
      <div class="row2" style="margin-bottom:10px">
        <button class="btn ghost" onclick="applyTk()">应用密钥</button>
        <button class="btn ghost" onclick="window.open('https://console.tianditu.gov.cn/api/key','_blank')">去申请密钥</button>
      </div>
      <p class="note">天地图密钥需你在 <b>天地图开放平台（console.tianditu.gov.cn）</b> 注册后自行申请，申请时选择「浏览器端」应用类型。密钥仅保存在本机，不会上传。代码中不内嵌任何有效密钥。</p>`;
  } else {
    out+=`<p class="note">腾讯地图为默认底图，通过本地代理调用，无需自备密钥。</p>`;
  }
  out+=`<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:10px 0">
      <span><i style="display:inline-block;width:16px;height:3px;background:#185FA5;vertical-align:middle;margin-right:5px"></i>最优路径</span>
      <span><i style="display:inline-block;width:16px;height:3px;background:#EF9F27;vertical-align:middle;margin-right:5px"></i>次优</span>
      <span><i style="display:inline-block;width:16px;height:3px;background:#B4B2A9;vertical-align:middle;margin-right:5px"></i>其他通道</span>
    </div>
    <div id="map-view"></div><div id="fallback"></div>
    <p class="note" style="margin-top:10px">站点位置为<b>县/市级近似</b>，精确站址见费率库中各通道的送受端地址（多数可到乡镇/村）。落点未采集的通道以省会位置示意。</p>
  </div>
  <div class="card tight"><div class="sec-title">通道费用分布<span class="hint">按输电价升序</span></div>
    <table><tr><th style="width:40%">通道</th><th>输电价</th><th>线损</th><th>容量</th></tr>
    ${[...CH].filter(c=>c.t!=null).sort((a,b)=>a.t-b.t).map(c=>`<tr>
      <td>${esc(c.n)}<br><span style="color:var(--ink3);font-size:10.5px">${esc(N(c.from))}→${esc(N(c.to))}</span></td>
      <td>${fmt(c.t)}</td><td>${fmt(c.loss,2)}%</td><td>${c.cap||'待补'}</td></tr>`).join('')}</table>
  </div>`;
  document.getElementById('v-map').innerHTML=out;
  setTimeout(()=>{
    if(state.mapProvider==='qq'){ if(!drawMapQQ()) showMapFallback(); }
    else { loadTianditu(ok=>{ if(ok){ if(!drawMapTD()) showMapFallback(); } else showMapFallback(); }); }
  },80);
}
function switchMap(p){ state.mapProvider=p; saveMap(); renderMap(); }
function applyTk(){ const el=document.getElementById('i-tk'); state.tiandituKey=(el?el.value:'').trim(); tdReady=false; saveMap(); renderMap(); }

/* ================= 视图 ================= */
function go(t){
  ['calc','map','lib'].forEach(x=>{ document.getElementById('v-'+x).hidden=(x!==t);
    document.getElementById('t-'+x).classList.toggle('on',x===t); });
  if(t==='lib') renderLib(); if(t==='map') renderMap(); if(t==='calc') renderCalc();
  window.scrollTo({top:0});
}
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='i-from'||id==='i-to'){
    state[id==='i-from'?'from':'to']=e.target.value;
    refreshProvinceParams(); state._res=null; renderCalc();
  }
});
loadStored();
if(!Object.keys(PV).includes(state.from)) state.from='SC';
if(!Object.keys(PV).includes(state.to)) state.to='JS';
if(state.pNet===undefined) refreshProvinceParams();
state._res=solve();
renderCalc();
</script>
</body>
</html>
