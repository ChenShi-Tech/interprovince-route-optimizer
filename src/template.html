<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<!-- theme-color 是浏览器 / 系统状态栏色，只能写字面值（不认 CSS 变量）：这里是清晰浅色的初值。
     紧跟在样式表后面的内联脚本在首帧前就按当前主题的 --system-bar 改写；启动后 ui/theme.js 的 syncSystemBars() 再同步一次 -->
<meta name="theme-color" content="#ffffff">
<title>省间中长期交付成本与报价测算</title>
<script>
/* 全局错误兜底（spec: runtime-error-feedback）：head 最先安装，先于腾讯地图脚本，
   捕获启动期第三方脚本错误。提示按消息去重并计数（上限 4 条）；不吞错误——
   onerror 返回 false、rejection 不 preventDefault，控制台照常留痕。
   配色写成 var(--令牌,字面兜底)：本脚本可能早于样式表生效就被触发（启动期第三方脚本报错），
   兜底值与 src/tokens.css 同值，样式就绪后自动跟随主题。 */
(function(){
  var items={}, order=[];
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function flush(){
    if(!document.body){ document.addEventListener('DOMContentLoaded',flush,{once:true}); return; }
    var box=document.getElementById('gerr-box');
    if(!order.length){ if(box) box.remove(); return; }
    if(!box){ box=document.createElement('div'); box.id='gerr-box';
      box.style.cssText='position:fixed;left:10px;right:10px;bottom:64px;z-index:var(--z-toast,3900);display:flex;flex-direction:column;gap:6px';
      document.body.appendChild(box); }
    box.innerHTML=order.map(function(k){
      return '<div style="background:var(--red-bg,#FCEBEB);color:var(--red,#A32D2D);border-radius:var(--radius-btn,10px);padding:8px 10px;font-size:11.5px;line-height:1.55;box-shadow:var(--shadow-toast,0 4px 14px rgba(0,0,0,.14));display:flex;gap:8px;align-items:flex-start">'
        +'<div style="flex:1;word-break:break-all">⚠ 运行时错误'+(items[k]>1?' ×'+items[k]:'')+'：<code>'+esc(k)+'</code></div>'
        +'<button data-gerr-close style="border:0;background:var(--toast-close-bg,rgba(163,45,45,.12));color:var(--red,#A32D2D);border-radius:var(--radius-inline,6px);padding:3px 8px;font-size:11px;flex:none;cursor:pointer">关闭</button></div>';
    }).join('');
  }
  function report(m){
    m=String(m==null?'未知错误':(m&&m.message)||m).slice(0,160);
    if(items[m]==null){ items[m]=1; order.push(m); if(order.length>4){ var drop=order.shift(); delete items[drop]; } }
    else items[m]++;
    flush();
  }
  window.onerror=function(m){ report(m); return false; };
  window.addEventListener('unhandledrejection',function(e){ report(e.reason); });
  document.addEventListener('click',function(ev){
    if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-gerr-close')!=null){ items={}; order=[]; flush(); }
  });
})();
</script>
<script>
/* 外观主题首帧设定（防首屏闪白）：先于样式表与应用脚本，按本机外观偏好算出 data-theme 设到 <html>。
   存储键 'iproute.v2.ui' 与 src/app/config.js 的 LS_UI 同名——这里在应用脚本之前执行、引用不到 config.js，
   只能写字面串，改名须两处同步；取值规则与 ui/theme.js 的 resolveTheme() 一致（科技固定深色；
   清晰按明暗，跟随系统时看 prefers-color-scheme）。存储不可用或内容损坏时静默回退默认（清晰 · 跟随系统）。 */
(function(){
  var style='clear', mode='system', dark=false;
  try{
    var o=JSON.parse(localStorage.getItem('iproute.v2.ui')||'null');
    if(o&&typeof o==='object'){ if(o.style==='tech') style='tech'; if(o.mode==='light'||o.mode==='dark') mode=o.mode; }
  }catch(e){}
  try{ dark=mode==='dark'||(mode==='system'&&!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)); }catch(e){}
  document.documentElement.setAttribute('data-theme',style==='tech'?'tech':(dark?'clear-dark':'clear'));
})();
</script>
<script type="text/javascript">
window._TMapSecurityConfig = {
  serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__',
};
</script>
<script>
/* 腾讯地图代理环境标志（M17）：全页唯一判断点，供 ui/map.js 的 isProxyEnv() 直接读取。
   判据＝页面就在本机回环地址上，且 _TMapSecurityConfig.serviceHost 已被下发环境替换成
   具体端口（构建产物里是 http://127.0.0.1:__WB_HTTP_PORT__/…，未替换时冒号后没有数字）。
   刻意不写成「字符串里还含不含 __WB_HTTP_PORT__」这类自指判据：下发环境的替换粒度不可知，
   若做全局文本替换，判据字面量本身会被一起替换掉而恒为 false（M17 的原始症状）。
   标志为 false 时 ui/map.js 一次请求都不发：APK(file://)、线上托管、本地未注入都属此列。 */
(function(){
  var ok=false;
  try{
    var h=(typeof location!=='undefined'&&location.hostname)||'';
    var cfg=window._TMapSecurityConfig||{};
    var svc=typeof cfg.serviceHost==='string'?cfg.serviceHost:'';
    ok=/^(127\.0\.0\.1|localhost)$/.test(h) && /:\d{2,5}\//.test(svc);
  }catch(e){ ok=false; }
  window.__WB_TMAP_PROXY__=ok;
})();
</script>
<!-- 腾讯地图 SDK（约 2.13MB）不再静态外链：<head> 同步外链会阻塞首屏，且 APK/托管环境到不了 map.qq.com。
     改为由 ui/map.js 按 __WB_TMAP_PROXY__ 动态注入（非代理环境零请求）。此标签只承载 SDK 地址，
     只有 src 被真正赋值时才发起请求；defer 作为兜底——万一被改回静态 src 也不会阻塞解析。 -->
<script id="tmap-sdk" defer data-src="https://map.qq.com/api/gljs?v=1.exp"></script>
<style>
/* 设计令牌（:root 变量）由构建脚本从 src/tokens.css 注入到下一行；本样式表只引用 var(--x)，不写颜色 / 圆角字面值 */
/*__TOKENS__*/
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:var(--page-pattern);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* #app 不再自铺底色：与 body 同为 --bg，去掉后像素不变；body 上的 --page-pattern（科技风格网格底纹）才透得出来 */
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--header-glass);backdrop-filter:saturate(180%) blur(12px);border-bottom:var(--hairline) solid var(--line);padding:12px 16px 10px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.2px;white-space:nowrap}
/* 页头右侧：状态徽标 + 外观 + 帮助。手机宽度放不下全部时，徽标先收缩成省略号，标题与两个按钮不换行、不缩 */
.hd-acts{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;min-height:36px}
.badge{font-size:10.5px;padding:2px 7px;border-radius:var(--radius-pill);background:var(--teal-bg);color:var(--teal);font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 要引起注意的状态（费率已本地修改，ui/lib.js 的 setVerBadge）：徽标挂 .mod，换蓝底、不收缩，放不下时由标题让位（截成省略号）。
   不认 :has() 的老内核退回默认排布：徽标照旧截断，title 仍给全文 */
.badge.mod{background:var(--blue-bg);color:var(--blue-ink)}
.hd-top:has(.badge.mod) h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hd-top:has(.badge.mod) .hd-acts,.hd-top:has(.badge.mod) .badge{flex:none}
/* FR-3：页头常驻帮助入口，任意时刻可重看新手导览。
   change: grid-map-device-fixes（D1，与 PR #28 设计系统合流）：帮助按钮改 ？ 圆钮——视觉 25px 与「外观」钮同高，
   点按区靠 ::after 透明扩区补足（限幅 4px，等效 ≥33px，spec: experience-fixes ≥32px）；颜色全走设计令牌，深浅主题都成立 */
.help-link{border:var(--hairline) solid var(--ghost-border);background:var(--card);color:var(--blue);border-radius:var(--radius-pill);padding:3px 10px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;flex:none}
.help-link.help-round{width:23px;height:23px;padding:0;border-radius:50%;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1;flex:none}
/* 全角「？」墨迹在 em 框内偏左上（canvas 实测 12px 字号下墨迹中心偏左 2.8px/偏上 1px），
   用 em 相对位移做光学居中补偿，随字号缩放；Android(Noto) 全角问号度量一致可复用 */
.help-link.help-round .qm{display:inline-block;transform:translate(.23em,.08em)}
/* 圆钮缩小后 50%-22px 会外扩 9.5px、越过 8px 按钮间距抢「外观」的点击，按 .seg.small 模式限幅 4px */
.help-link.help-round::after{top:max(-4px,min(0px,calc(50% - 22px)));bottom:max(-4px,min(0px,calc(50% - 22px)));left:max(-4px,min(0px,calc(50% - 22px)));right:max(-4px,min(0px,calc(50% - 22px)))}
/* 底部留白收紧：main 不再预留 96px 导航让位空间，改由页脚自带导航条高度的内边距，
   声明文字贴在固定导航条上方可见（此前整段页脚被 nav 盖住，等于 48px 纯死空白） */
/* overflow-x 用 clip 而不是 hidden（M14）：hidden 会把计算值 overflow-y 变成 auto，main 随之
   成为滚动容器，其内部 .col-side / .col-ai 的 sticky 参照系就是 main 的 scrollport 而非视口，
   吸附位移恒为 0（宽屏下左栏滚出视野）。clip 同样横向裁切但不创建滚动容器，sticky 恢复正常。
   注意：不要给 main 或任一祖先加 overflow 的 hidden/auto/scroll，同类问题会在其它 sticky 元素上重演。 */
main{flex:1;padding:14px 16px 8px;overflow-x:clip}
/* 末尾卡片的外边距属于尾部留白，由页脚间距接管。
   深层选择器：各 Tab 内容末尾的 margin 在任意嵌套层泄漏会导致
   「声明文字与导航的距离」随 Tab 不同（测算 .sub 8px / 费率库卡片 12px），
   统一在每一层清零后，声明文字上间距恒等于 .disclaim 的 padding-top */
main section>:last-child,main section :last-child{margin-bottom:0}
/* z-index 3000：地图图层（含 canvas/WebView 层叠上下文）不得盖住固定导航（底栏遮挡修复） */
nav{position:fixed;bottom:0;left:0;right:0;z-index:3000;background:var(--nav-glass);backdrop-filter:saturate(180%) blur(12px);border-top:var(--hairline) solid var(--line);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:11px;color:var(--ink3);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--blue)}
nav .ic{width:20px;height:20px;display:block;stroke:var(--ink3)}
nav button.on .ic path,nav button.on .ic circle,nav button.on .ic rect{stroke:var(--blue)}
/* REQ-307：页脚定位声明，三 Tab 共用。底部内边距 = 固定导航条高度(≈64px) + 4px 呼吸隙，
   含 safe-area 适配（与 nav 的 max(6px,env(safe-area-inset-bottom)) 对应） */
.disclaim{padding:6px 16px calc(68px + env(safe-area-inset-bottom));text-align:center;font-size:10.5px;color:var(--ink3);line-height:1.6}
.card{background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--card-highlight)}
.card.tight{padding:12px}
.sec-title{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title .hint{font-size:11px;font-weight:400;color:var(--ink3)}
label.f{display:block;margin-bottom:11px}
label.f:last-child{margin-bottom:0}
label.f span{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--field-bg);border:var(--hairline) solid var(--field-border);border-radius:var(--radius-field);padding:9px 10px;appearance:none;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:var(--focus-ring)}
textarea{resize:vertical;min-height:64px;line-height:1.5;font-size:13px}
/* 下拉箭头是 data: URI 里的 SVG（箭头色写死在 URI 中、不认 CSS 变量），整条 url(...) 放在令牌 --select-chevron 里，各主题各写一条 */
select{background-image:var(--select-chevron);background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
input[type=number]{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
input:disabled{cursor:not-allowed}
/* FR-1（PRD-体验问题修复）三层防御之显示层与 CSS 兜底：
   超限输入红框 + 输入框下方红字提示（sanNum 钳制，修正后消失）；
   hero 大字与容量三卡对任意异常值不再破版（V3 原型实测三条规则即可消除溢出） */
input.clamp-bad{border-color:var(--red);box-shadow:var(--focus-ring-bad)}
.clamp-hint{color:var(--red);font-size:11px;line-height:1.5;margin-top:4px}
.hero-v{overflow-wrap:anywhere}
.g3>*{min-width:0}
.mc .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 批次 B：tier 线型图例样本（虚/点线用 border 复刻 SVG dasharray 语义） */
.lg-line{display:inline-block;width:16px;height:0;vertical-align:middle;margin-right:4px}
/* 密钥输入框：掩码显示 + 右侧小眼睛切换可见性（toggleTkVis 在 ui/map.js） */
.tk-wrap{position:relative}
.tk-wrap input{padding-right:38px}
.tk-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  border:0;background:none;cursor:pointer;padding:6px;color:var(--ink3);
  display:flex;align-items:center;justify-content:center;border-radius:var(--radius-mini)}
.tk-eye:hover{background:var(--gray-bg);color:var(--ink2)}
.tk-eye svg{width:18px;height:18px;display:block;pointer-events:none}
/* 该字段在当前口径下不参与计算：置灰但保留在 DOM 中（readInputs 仍按 id 读取） */
label.f.off span{color:var(--ink3)}
label.f.off input{background:var(--gray-bg);color:var(--ink3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* REQ-701+704 统一对齐策略：列内改 flex 纵列并 justify-content:flex-end，
   输入框在等高的 grid 列内底线对齐——标签允许自由换行（不截断），换行不再顶歪输入框 */
.row2>label.f{display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:0}
.row2:has(>label.f){margin-bottom:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{width:100%;font-family:inherit;font-size:15px;font-weight:600;color:var(--on-fill);background:var(--blue);border:0;border-radius:var(--radius-btn);padding:13px;cursor:pointer;letter-spacing:.2px}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--blue);border:var(--hairline) solid var(--ghost-border);font-weight:500;font-size:13px;padding:9px}
details.adv{border-top:var(--hairline) solid var(--line2);margin-top:12px;padding-top:11px}
/* 只作用于本层 summary（子选择器）：后代选择器会让嵌套的 details.explain 随外层展开显示成「−」 */
details.adv>summary{font-size:12px;color:var(--blue);cursor:pointer;list-style:none;font-weight:500}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"+ ";font-weight:600}
details.adv[open]>summary::before{content:"− "}
details.adv .inner{padding-top:11px}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;margin:8px 0 0}
/* 长段说明文字的折叠容器：默认收起只留一行可点的标题，免得正文被注释淹没。
   与 details.adv（表单项的高级区）区分开：这个是纯阅读内容，所以用更轻的灰底细边。 */
details.explain{margin:8px 0 9px;border:var(--hairline) solid var(--line2);border-radius:var(--radius-field);background:var(--explain-bg)}
details.explain>summary{font-size:11.5px;color:var(--blue);cursor:pointer;list-style:none;font-weight:500;padding:8px 11px;display:flex;align-items:center;gap:6px;line-height:1.5}
details.explain>summary::-webkit-details-marker{display:none}
details.explain>summary::before{content:"＋";font-weight:600;font-size:11px;flex:0 0 auto}
details.explain[open]>summary::before{content:"－"}
details.explain[open]>summary{border-bottom:var(--hairline) solid var(--line2)}
details.explain>summary em{font-style:normal;color:var(--ink3);font-weight:400;font-size:11px;margin-left:auto;white-space:nowrap}
details.explain .inner{padding:9px 11px 10px}
details.explain .note{margin:0}
details.explain .note+.note{margin-top:7px}
details.explain .note:last-child{margin-bottom:0}
.warn{background:var(--amber-bg);color:var(--amber);font-size:11.5px;padding:9px 11px;border-radius:var(--radius-field);line-height:1.55;margin-bottom:12px}
.warn.ok{background:var(--teal-bg);color:var(--teal)}
.warn.bad{background:var(--red-bg);color:var(--red)}
.route-head{font-size:15px;font-weight:600;color:var(--blue-ink);word-break:break-all;line-height:1.4}
.route-head .arw{color:var(--ink3);font-weight:400;margin:0 3px}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.15}
.big .u{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px;letter-spacing:0}
.rank{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);background:var(--blue-bg);color:var(--blue-ink);white-space:nowrap}
.rank.g{background:var(--gray-bg);color:var(--gray)}
.bar{display:flex;height:26px;border-radius:var(--radius-inline);overflow:hidden;margin:12px 0 9px;border:var(--hairline) solid var(--line2)}
.bar div{height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--ink2)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:var(--radius-swatch);margin-right:4px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:var(--hairline) solid var(--line2);gap:10px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-num);text-align:right}
.kv .m{color:var(--ink2);flex-shrink:0}
.kv.tot{border-top:var(--hairline) solid var(--line);border-bottom:0;margin-top:4px;padding-top:8px;font-size:13.5px}
.kv.tot b{color:var(--blue-ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--gray-bg);color:var(--gray);font-weight:500}
.chip.ok{background:var(--teal-bg);color:var(--teal)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.info{background:var(--blue-bg);color:var(--blue-ink)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
/* 通道下拉（单选）：选定具体通道时高亮，提示当前已按通道筛选 */
.chan select.on{border-color:var(--blue);background-color:var(--blue-bg);color:var(--blue-ink)}
table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
th,td{padding:6px 4px;text-align:right;border-bottom:var(--hairline) solid var(--line2);font-variant-numeric:tabular-nums;font-family:var(--font-num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:500;font-size:11px}
td b{font-weight:600}
.tier{display:inline-block;font-size:10.5px;padding:1px 5px;border-radius:var(--radius-tag);font-weight:600;vertical-align:middle;margin-left:4px;white-space:nowrap}
.tier.gov{background:var(--teal-bg);color:var(--teal)}
.tier.grid{background:var(--blue-bg);color:var(--blue-ink)}
.tier.region{background:var(--amber-bg);color:var(--amber)}
.tier.est{background:var(--gray-bg);color:var(--ink3)}
.mono{font-family:var(--font-mono);font-size:11px;line-height:1.7;word-break:break-all}
.formula{background:var(--gray-bg);border-radius:var(--radius-field);padding:10px 11px;margin-top:4px}
.formula .mono{color:var(--ink)}
.formula .txt{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.6}
.lib-row{border-bottom:var(--hairline) solid var(--line2);padding:9px 0}
.lib-row:last-child{border-bottom:0}
.lib-nm{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lib-nm em{font-style:normal;font-size:10.5px;font-weight:500;color:var(--ink3);background:var(--gray-bg);padding:1px 6px;border-radius:var(--radius-pill);white-space:nowrap}
.lib-io{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}
.lib-io>div{display:flex;flex-direction:column;justify-content:flex-end}
.lib-io label{font-size:10.5px;color:var(--ink3);display:block;margin-bottom:3px}
.lib-io input{padding:6px 8px;font-size:12.5px;border-radius:var(--radius-mini)}
.lib-src{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
/* 费率库卡片（通道 / 省级参数）：lib.js 在所有宽度下都渲染 details.libcard，属移动端基础样式；
   .libgrid 手机单列，≥900px 两列（见桌面端适配） */
.libcard{border:var(--hairline) solid var(--line);border-radius:var(--radius-btn);background:var(--card);margin-bottom:7px;overflow:hidden}
.libcard summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.libcard summary::-webkit-details-marker{display:none}
.libcard[open] summary{border-bottom:var(--hairline) solid var(--line2);background:var(--gray-bg)}
.lc-n{font-size:13px;font-weight:600;grid-column:1;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-tag{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amber-bg);padding:1px 5px;border-radius:var(--radius-tag);margin-left:5px}
.lc-p{grid-column:2;grid-row:1/3;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-num);text-align:right;align-self:center}
.lc-p small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-left:1px}
.lc-m{grid-column:1;grid-row:2;font-size:10.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-b{grid-column:1;grid-row:3}
.lc-body{padding:11px 12px}
.lc-kv{font-size:11px;color:var(--ink2);line-height:1.7;margin-top:9px;padding-top:8px;border-top:var(--hairline) solid var(--line2)}
.lc-kv span{display:inline-block;min-width:74px;color:var(--ink3)}
.libcount{font-size:11px;color:var(--ink3);margin-bottom:7px}
.libgrid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
/* 手机 / 折叠屏（<900px）：卡片只有约 300px 宽，名称与元信息单行省略会把标签、线损、容量截掉，
   改为换行——名称与标签按整颗换行、左缘对齐；元信息只在空格处断行（「容量待补」不被拆开）；
   区域口径通道的「送出省参考价」前缀缩成小字另起一行，不再挤占名称列；明细键值折行时悬挂缩进 */
@media (max-width:899px){
  .lc-n{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;white-space:normal;line-height:1.45}
  .lc-tag{margin-left:0;max-width:100%;line-height:1.35}
  .lc-m{white-space:normal;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
  .lc-pre{display:block;font-size:10.5px;font-weight:500;color:var(--ink3)}
  .lc-kv>div{padding-left:74px;text-indent:-74px}
  .lc-kv span{text-indent:0}
  .lib-src{overflow-wrap:anywhere}   /* 来源里的长网址不会自然断行，卡片 overflow:hidden 下会被裁掉 */
}
.prow{display:grid;grid-template-columns:58px 1fr 1fr 1fr 44px;gap:6px;align-items:center;padding:5px 0;border-bottom:var(--hairline) solid var(--line2)}
.prow:first-of-type{font-size:10.5px;color:var(--ink3)}
.prow .pn{font-size:12px;font-weight:500}
.prow input{padding:5px 6px;font-size:12px;border-radius:var(--radius-inline)}
#map-view,#fallback{width:100%;height:calc(100vh - 290px);min-height:320px;border-radius:var(--r);overflow:hidden;background:var(--map-fallback);border:var(--hairline) solid var(--line)}
/* 地图 API（天地图/腾讯）内部图层 z-index 高达 200~1000+：容器若不建立层叠上下文，
   这些图层会在根层叠环境里压过 z-index:30 的固定底栏（容器延伸到视口底时必现）。
   contain:paint 把全部后代绘制（含 fixed）裁进容器并创建层叠上下文，z-index:0 兜底。 */
#map-view{contain:paint;position:relative;z-index:0}
/* REQ-603+702：svg 拓扑模式容器高度随绘制纵横比自适应（viewBox 660×430），
   仅约束 .topo-svg；qq/td 底图模式仍走上方固定高规则。
   change: grid-map-device-fixes（D2）：拓扑模式接管触摸——touch-action:none 阻止浏览器
   手势（滚动/双指缩放页面）与自定义捏合冲突；user-select:none 防拖动时选中 SVG 文字。
   qq/td 模式不设 touch-action，保留底图原生手势。 */
#map-view.topo-svg{height:auto;min-height:0;aspect-ratio:660/430;touch-action:none;user-select:none;-webkit-user-select:none}
#fallback{display:none;padding:16px;font-size:12px;color:var(--ink2);overflow:auto}
.empty{text-align:center;padding:36px 20px;color:var(--ink3);font-size:12.5px;line-height:1.7}
.empty-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.empty-acts .btn{width:auto;padding:9px 16px}
.mc{background:var(--gray-bg);border-radius:var(--radius-field);padding:8px 10px}
.mc .l{font-size:10.5px;color:var(--ink3);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.mc .v small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-left:2px}
.sub{font-size:11.5px;font-weight:600;color:var(--ink2);margin:15px 0 8px;padding-bottom:5px;border-bottom:var(--hairline) solid var(--line2);display:flex;justify-content:space-between;gap:8px}
.sub:first-child{margin-top:0}
.sub em{font-style:normal;font-weight:400;color:var(--ink3);font-size:10.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.segblk{border:var(--hairline) solid var(--line2);border-radius:var(--radius-field);padding:10px;margin-bottom:8px;background:var(--card)}
.segblk .hd{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.segblk .hd em{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:500}
.segblk .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 0}
.segblk .grid div{font-size:10.5px;color:var(--ink3);line-height:1.4}
.segblk .grid b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.src{font-size:10.5px;color:var(--ink3);line-height:1.6;margin-top:8px;padding-top:7px;border-top:var(--hairline) solid var(--line2)}
.src q{display:block;font-style:normal;color:var(--ink2);background:var(--gray-bg);border-radius:var(--radius-inline);padding:6px 8px;margin-top:5px;line-height:1.6;word-break:break-all}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:var(--radius-pill);background:var(--blue-bg);color:var(--blue-ink);font-weight:600;margin-right:4px;white-space:nowrap}
.pill.g{background:var(--gray-bg);color:var(--ink3)}
.pill.a{background:var(--amber-bg);color:var(--amber)}
.meter{height:5px;border-radius:var(--radius-meter);background:var(--gray-bg);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--blue)}
.meter i.hi{background:var(--amber)}
.meter i.over{background:var(--red)}

.picker{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--card-highlight)}
.pk-col{min-width:0}
.pk-lb{font-size:10.5px;color:var(--ink3);margin-bottom:5px;font-weight:500}
.pk-col select{font-size:15px;font-weight:600;padding:9px 26px 9px 10px}
.pk-arw{font-size:16px;color:var(--ink3);padding-bottom:11px}
/* 与 .picker 同一套尺寸：同样的内边距、标签字号与控件高度，桌面端并排时两张卡片等高对齐 */
.bar-params{display:grid;grid-template-columns:1.15fr .8fr .7fr .7fr;gap:8px;align-items:end;background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.bar-params label{display:block;min-width:0}
.bar-params span{display:block;font-size:10.5px;color:var(--ink3);margin-bottom:5px;font-weight:500}
.bar-params input,.bar-params select{padding:9px 10px;font-size:15px;font-weight:600}
.bar-params select{padding-right:26px}
/* 顶部主卡：线路与电量 → 送端报价（主输入，放大）与测算结果 → 价格组成。
   .picker / .bar-params 嵌入主卡时去掉各自的卡片外观 */
.hero{background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--card-highlight)}
.hero .picker,.hero .bar-params{background:none;border:0;border-radius:0;padding:0;margin:0;box-shadow:none}
.hero .bar-params{grid-template-columns:1fr 1fr;margin-top:10px}
.hero .chan{margin-top:10px;min-width:0}
.hero-main{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:var(--hairline) solid var(--line2)}
.hero-price{display:block;min-width:0}
.hero-price span,.hero-lb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.hero-price input{font-family:var(--font-num);font-size:34px;font-weight:700;letter-spacing:-.5px;padding:12px 14px;border-radius:var(--r);border:var(--emphasis) solid var(--hero-field-border);line-height:1.2;box-shadow:var(--hero-field-glow)}
.hero-price input:focus{border-color:var(--blue);box-shadow:var(--focus-ring-hero)}
.hero-res{background:var(--blue-bg);border-radius:var(--r);padding:10px 14px 11px;min-width:0}
.hero-res.empty-res{background:var(--gray-bg)}
.hero-tag{font-size:10.5px;font-weight:600;color:var(--blue-ink);background:var(--card);padding:1px 7px;border-radius:var(--radius-pill)}
.hero-v{font-size:34px;font-weight:700;letter-spacing:-.6px;color:var(--blue-ink);font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.2;text-shadow:var(--num-glow)}
.hero-v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:4px;letter-spacing:0}
.hero-sub{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5;word-break:break-all}
.cmp{margin-top:12px}
.cmp-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--ink2)}
.cmp-hd em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3)}
.cmp-bar{display:flex;height:10px;border-radius:var(--radius-bar);overflow:hidden;margin:8px 0 10px;background:var(--gray-bg)}
.cmp-bar i{display:block;height:100%}
.cmp-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cmp-item{background:var(--gray-bg);border-radius:var(--radius-field);padding:7px 10px;min-width:0}
.cmp-item .l{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-item .l i{flex:0 0 auto;width:8px;height:8px;border-radius:var(--radius-swatch)}
.cmp-item .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.3}
.cmp-item .p{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.cmp-item.tot{background:var(--blue-bg)}
.cmp-item.tot .l,.cmp-item.tot .v{color:var(--blue-ink);font-weight:700}
/* 费用口径与参数：紧凑网格，每项只占一格，不再整行铺满 */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px;margin-bottom:10px}
.pgrid label.f{display:flex;flex-direction:column;justify-content:flex-end;margin:0;min-width:0}
.pgrid label.f span{display:flex;align-items:baseline;gap:6px;font-size:11.5px;margin-bottom:4px;white-space:nowrap}
.pgrid input,.pgrid select{font-size:13px;padding:7px 9px;border-radius:var(--radius-compact)}
.pgrid select{padding-right:26px;background-position:right 8px center}
.p-reset{color:var(--blue);font-weight:500;cursor:pointer;font-size:11px}
/* 主卡口径摘要：面板收起后仍能看到当前口径；与默认值不同的项标色，按钮角标为改动项数 */
.cfg-bar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 8px 7px 11px;background:var(--gray-bg);border-radius:var(--radius-btn)}
.cfg-sum{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px;color:var(--ink2);line-height:1.5}
.cfg-sum span{background:var(--card);border-radius:var(--radius-inline);padding:1px 7px;max-width:100%;overflow-wrap:anywhere}
.cfg-sum span.chg{background:var(--amber-bg);color:var(--amber);font-weight:600}
.btn.cfg-btn{flex:none;width:auto;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--card)}
.cfg-btn svg{width:15px;height:15px;display:block}
.cfg-btn b{min-width:17px;height:17px;padding:0 5px;border-radius:var(--radius-field);background:var(--amber);color:var(--on-fill);font-size:10.5px;line-height:17px;text-align:center}
/* 参数弹出面板 */
.sheet{position:fixed;inset:0;z-index:3500;visibility:hidden;pointer-events:none;transition:visibility 0s linear .25s}
.sheet.open{visibility:visible;pointer-events:auto;transition:visibility 0s}
.sheet-mask{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet.open .sheet-mask{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--card);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:var(--shadow-sheet);transform:translateY(100%);transition:transform .25s ease}
.sheet.open .sheet-panel{transform:none}
.sheet-grab{flex:none;width:36px;height:4px;border-radius:var(--radius-swatch);background:var(--sheet-grab);margin:8px auto 0}
.sheet-hd{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 16px 10px;border-bottom:var(--hairline) solid var(--line2)}
.sheet-title{font-size:15px;font-weight:700}
.sheet-price{font-size:19px;font-weight:700;color:var(--blue-ink);font-variant-numeric:tabular-nums;font-family:var(--font-num);margin-top:1px}
.sheet-price small{font-size:11px;font-weight:500;color:var(--ink3);margin-left:4px}
.sheet-x{flex:none;border:0;background:var(--gray-bg);color:var(--ink2);width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:0}
.sheet-ft{flex:none;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:var(--hairline) solid var(--line2)}
.sheet-ft .btn{padding:11px;font-size:14px}
body.sheet-open{overflow:hidden}
/* 外观面板（#theme-sheet）复用上面的弹层结构；没有底部按钮栏，正文自己让出底部安全区 */
#theme-sheet .sheet-body{padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media (min-width:600px){
  .sheet-panel{left:auto;top:0;width:400px;max-height:none;border-radius:var(--radius-sheet) 0 0 var(--radius-sheet);transform:translateX(100%);box-shadow:var(--shadow-sheet-side)}
  .sheet-grab{display:none}
  .sheet-hd{padding-top:16px}
}
.tsub{font-size:10.5px;color:var(--ink3);white-space:normal}
/* 参数面板分组小标题；到户缺项醒目提示 */
.psub{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 8px;padding-bottom:5px;border-bottom:var(--hairline) solid var(--line2)}
.psub:first-child{margin-top:0}
.psub em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3);text-align:right}
.p-calc{font-style:normal;font-weight:600;color:var(--blue-ink);font-size:11px}
.p-note{font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius-compact);padding:6px 10px;margin:0 0 8px;line-height:1.5}
.cfg-warn{margin-top:8px;font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius-field);padding:7px 11px;line-height:1.5}
.cfg-warn a{color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.policy-foot{margin:4px 0 0}
.policy-foot details.explain{background:var(--card);margin:0}
/* 智能推荐 */
.ai-bar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.ai-bar .btn{padding:10px;font-size:13.5px}
.ai-bar .btn.ghost{padding:10px 12px;white-space:nowrap}
.ai-bar .btn:disabled{opacity:.55;cursor:wait}
.ai-cfg{margin-top:10px;padding-top:10px;border-top:var(--hairline) solid var(--line2)}
.ai-loading{margin-top:10px;font-size:11.5px;color:var(--ink2);background:var(--blue-bg);border-radius:var(--radius-field);padding:9px 11px;line-height:1.55}
.ai-res{margin-top:10px}
.ai-sum{font-size:12px;color:var(--ink2);line-height:1.65;margin:0 0 8px}
.ai-rec{display:block;width:100%;text-align:left;font-family:inherit;background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--radius-btn);padding:10px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.ai-rec.on{border-color:var(--blue);background:var(--blue-bg)}
.ai-rec-hd{display:flex;align-items:center;gap:8px}
.ai-rec-hd .rc-no{font-size:11px;font-weight:700;color:var(--blue-ink)}
.ai-rec-price{margin-left:auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.ai-rec-price small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-left:2px}
.ai-rec-route{font-size:12px;font-weight:600;margin-top:5px}
.ai-rec-line{font-size:11px;color:var(--ink3);margin-top:2px}
.ai-rec-why{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:6px;padding-top:6px;border-top:var(--hairline) dashed var(--line2)}
details.adv.boxed{border:var(--hairline) solid var(--line);border-radius:var(--r);background:var(--card);padding:11px 14px;margin-bottom:10px;box-shadow:var(--card-highlight)}
details.adv.boxed .inner{padding-top:12px}
details.adv.boxed>summary{font-size:12.5px}
.rlist{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.rlist::-webkit-scrollbar{height:4px}
.rlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--radius-swatch)}
.rc{flex:0 0 auto;width:104px;text-align:left;font-family:inherit;cursor:pointer;background:var(--card);border:var(--hairline) solid var(--line);border-radius:var(--radius-btn);padding:9px 10px;transition:border-color .15s,background .15s}
.rc.on{border:var(--emphasis) solid var(--blue);background:var(--blue-bg)}
.rc.bad{opacity:.7;border-style:dashed}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:5px}
.rc-no{font-size:10.5px;font-weight:700;color:var(--blue);flex:0 0 auto}
.rc.on .rc-no{color:var(--blue-ink)}
.rc-tag{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-price{font-size:17px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.1}
.rc-price small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-left:1px;letter-spacing:0}
.rc-meta{font-size:10.5px;color:var(--ink3);margin-top:3px}
.rlist-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;color:var(--ink3);margin-top:4px}
.tg{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.tg input{width:auto;margin:0;padding:0}
/* 复选框 / 单选框恢复原生外观：全局 input{appearance:none} 会把它们画成空白圆角框，勾上后看不出状态。
   同时撤掉全局 input 的铺满宽度与内边距（原生控件会被拉伸），勾选色取品牌蓝、随主题变化 */
input[type=checkbox],input[type=radio]{appearance:auto;accent-color:var(--blue);width:auto;padding:0;margin:0;flex:none;cursor:pointer}
/* 可点区域 ≥44px、外观尺寸不变：给小控件挂一个透明伪元素，向外扩到至少 44×44（已够大的方向不扩）。
   inset 用 min(0px, 50% − 22px)：百分比相对控件自身，控件已 ≥44px 时取 0，不会缩小原命中区。
   扩区不得盖住相邻的可点控件：换行排布的 .seg.wrap（行距 5px）完全不扩；其余紧凑排布的见下一段的限幅规则。
   控件自建层叠上下文（z-index:0）、伪元素垫在 -1 层：扩出的透明区压在邻近静态内容之上可点，
   但压不住控件自己的子元素（复选框、图标、角标），点它们时命中的仍是子元素本身 */
.sheet-x,.help-link,.tg,.btn.ghost,.seg:not(.wrap) button,details.adv>summary,details.explain>summary,.plan-issues>summary{position:relative;z-index:0}
.tk-eye{z-index:0}
.sheet-x::after,.tk-eye::after,.help-link::after,.tg::after,.btn.ghost::after,.seg:not(.wrap) button::after,
details.adv>summary::after,details.explain>summary::after,.plan-issues>summary::after{content:"";position:absolute;
  top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px));z-index:-1}
/* 紧凑排布的扩区：相邻两个可点控件朝对方扩出的距离加起来，不超过两者间距减 2px（留给舍入），否则会盖住邻居、抢走它边缘的点击。
   · 纵向不扩、只横向扩：.hit-x（网架图换行排布的搜索结果，行距 6px；「复制链接」，下隔 10px 是底图切换；
     「导出快照」，下隔 6px 是拓扑图）与所有复选框标签 .tg（网架图两行开关只隔 4px；「含越限」上邻路线卡、下邻展开按钮）；
   · 限幅：小号分段按钮 .seg.small（网架图底图切换）上下各最多 4px；密钥显隐按钮叠在输入框右端，向左最多 4px，
     不越过输入框给它预留的 38px 右内边距、不抢打字区的点击。
   tests/e2e.mjs 的 UI-HIT 在控件外沿与扩区内逐点取样守住这几条；规范见 docs/12 第 7 节。 */
.btn.hit-x::after,.tg::after{top:0;bottom:0}
.seg.small:not(.wrap) button::after{top:max(-4px,min(0px,calc(50% - 22px)));bottom:max(-4px,min(0px,calc(50% - 22px)))}
.tk-eye::after{left:max(-4px,min(0px,calc(50% - 22px)))}
/* 方案卡片：路线（左）+ 价格（右，突出）→ 价格组成条（悬停 / 聚焦显示分项）→ 关键指标 → 标签与区域网损对照 */
.plan-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.plan-no{font-size:12.5px;font-weight:700;color:var(--ink2)}
.plan-st{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap}
.plan-st.ok{background:var(--teal-bg);color:var(--teal)}
.plan-st.bad{background:var(--red-bg);color:var(--red)}
.plan-main{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plan-route{min-width:0;flex:1}
.hd-route{font-size:21px;font-weight:700;color:var(--blue-ink);line-height:1.3;word-break:break-all}
.hd-route .arw{color:var(--ink3);font-weight:400;margin:0 6px;font-size:16px}
.hd-route .rg{color:var(--teal)}
.plan-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.hd-landing{font-size:12.5px;color:var(--ink2)}
.hd-landing b{color:var(--ink);font-weight:600}
.lines{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ln{font-size:11px;font-weight:600;padding:2px 9px;border-radius:var(--radius-pill);background:var(--blue-bg);color:var(--blue-ink);white-space:nowrap}
.ln.ac{background:var(--teal-bg);color:var(--teal)}
.plus{font-size:10.5px;color:var(--ink3)}
.plan-price{flex:none;text-align:right}
.plan-price b{display:block;font-size:30px;font-weight:750;letter-spacing:-.6px;color:var(--blue-ink);font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.1;text-shadow:var(--num-glow)}
.plan-price small{display:block;font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap}
.pbar{display:flex;gap:2px;height:12px;margin:14px 0 2px}
.pbar i{position:relative;display:block;height:100%;min-width:3px;cursor:help;outline:none;font-style:normal;transition:box-shadow .12s}
.pbar i:first-child{border-radius:var(--radius-inline) 0 0 var(--radius-inline)}
.pbar i:last-child{border-radius:0 var(--radius-inline) var(--radius-inline) 0}
.pbar i:only-child{border-radius:var(--radius-inline)}
.pbar i:hover,.pbar i:focus{box-shadow:var(--focus-ring-bar);z-index:2}
.pbar i::after{content:attr(data-tip);display:none;position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--tooltip-bg);color:var(--tooltip-ink);font-size:11.5px;font-weight:500;line-height:1.4;padding:5px 9px;border-radius:var(--radius-mini);white-space:nowrap;pointer-events:none;z-index:5}
.pbar i:hover::after,.pbar i:focus::after{display:block}
.pbar i:first-child::after{left:0;transform:none}
.pbar i:last-child::after{left:auto;right:0;transform:none}
.plan-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.plan-kpi>div,.kpi>div{background:var(--gray-bg);border-radius:var(--radius-field);padding:7px 10px;min-width:0}
.plan-kpi span,.kpi span{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-kpi b,.kpi b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-num);color:var(--ink)}
.plan-kpi small,.kpi small{font-size:10.5px;color:var(--ink3);margin-left:3px}
.plan-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.rl-cmp{display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px;font-size:11px;color:var(--ink3);background:var(--gray-bg);border-radius:var(--radius-pill);padding:2px 3px 2px 10px}
.rl-cmp span{padding:1px 8px;border-radius:var(--radius-pill);color:var(--ink2);white-space:nowrap}
.rl-cmp span.on{background:var(--card);color:var(--blue-ink);font-weight:600;box-shadow:0 0 0 var(--hairline) var(--line)}
.rl-cmp b{font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.plan-issues{margin-top:10px;border-left:3px solid var(--issue-accent);background:var(--amber-bg);border-radius:0 var(--radius-compact) var(--radius-compact) 0;padding:6px 10px}
.plan-issues>summary{font-size:12px;color:var(--amber);font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.plan-issues>summary::-webkit-details-marker{display:none}
.plan-issues>summary::before{content:"＋";font-size:11px}
.plan-issues[open]>summary::before{content:"－"}
.plan-issues>summary b{background:var(--card);border-radius:var(--radius-pill);padding:0 7px;font-size:10.5px}
.plan-issues .note{color:var(--amber);margin:6px 0 0}
.plan-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.plan-actions .btn.ghost{padding:8px 6px;font-size:13px}
/* 交易连接：节点 → 专项工程段卡片（关键参数放大，物理估算降级为一行小字）→ 区域网架卡片 */
.tl{position:relative;padding-left:2px}
.tl-node{display:flex;gap:10px;align-items:flex-start}
.tl-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--blue);margin-top:6px;position:relative;z-index:2}
.tl-node.end .tl-dot{border-color:var(--teal);background:var(--teal)}
.tl-info{min-width:0;padding-bottom:8px}
.tl-name{font-size:15px;font-weight:700;line-height:1.35}
.tl-st{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.tl-ad{color:var(--ink3);font-size:11px;margin-left:4px}
.tl-seg{display:flex;gap:10px}
.tl-seg-line{flex:0 0 auto;width:11px;display:flex;justify-content:center}
.tl-seg-line::before{content:"";width:2px;background:var(--timeline-line);border-radius:var(--radius-line);flex:1}
.tl-seg-card{flex:1;min-width:0;background:var(--gray-bg);border-radius:var(--r);padding:12px 13px;margin-bottom:12px}
.tl-seg-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tl-seg-n{font-size:16px;font-weight:700;margin-right:auto}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi>div{background:var(--card)}
.tl-seg-card .meter{margin-top:10px}
.tl-cap{font-size:11.5px;color:var(--ink2);margin-top:5px}
.tl-cap b{color:var(--ink);font-weight:600}
.tl-sub{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.6}
.tl-sub i{font-style:normal;margin:0 6px}
.tl-sub em{font-style:normal}
.tl-src{font-size:10.5px;color:var(--ink3);margin-top:8px;padding-top:8px;border-top:var(--hairline) solid var(--seg-divider);line-height:1.5}
.route-timeline .sec-title{flex-wrap:wrap;gap:5px}
.region-seg>.tl-seg-line::before{background:var(--region-line)}
.region-network{flex:1;min-width:0;border:1px solid var(--region-border);background:var(--region-bg);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.region-network-hd,.region-charge-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.region-network-hd h3{font-size:16px;font-weight:700;color:var(--teal);margin:0}
.region-connection{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 12px}
.region-connection>span{text-align:center;min-width:0}
.region-connection>span b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.region-connection small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.region-connection strong{font-size:14px;font-weight:700;color:var(--teal);border:var(--emphasis) dashed var(--region-dash);border-radius:var(--radius-btn);background:var(--card);padding:10px 16px;text-align:center;white-space:nowrap}
.region-connection i{font-style:normal;color:var(--region-arrow);font-size:16px}
.region-charge{padding:12px 14px;background:var(--card);border:1px solid var(--region-card-border);border-radius:var(--radius-btn);scroll-margin-top:90px}
.region-charge-hd{margin-bottom:10px}
.region-charge-hd b{font-size:14px}
.region-charge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.region-charge-grid>div{background:var(--region-bg);border-radius:var(--radius-field);padding:8px 10px;min-width:0}
.region-charge-grid>div>span{display:block;font-size:11px;color:var(--ink3);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-charge-grid b{font-size:20px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;font-family:var(--font-num);color:var(--ink)}
.region-charge-grid small{font-size:11px;color:var(--ink3);margin-left:3px}
.region-charge-grid em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius-pill);padding:0 6px;margin-left:5px;vertical-align:middle}
.region-charge details.explain{margin:10px 0 0}
.region-charge-note{font-size:11px;line-height:1.65;color:var(--ink2);margin:8px 0 0}
.region-charge-note a{color:var(--blue-ink)}
.region-capacity.exceeded{font-size:11.5px;color:var(--red);font-weight:600;line-height:1.6;margin:10px 0 0}
.region-settlement{margin-top:12px}
.region-settlement>.region-network-hd{margin-bottom:12px}
@media(max-width:599px){
  .hd-route{font-size:18px}
  .plan-price b{font-size:24px}
  .plan-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-kpi b,.kpi b{font-size:15px}
  .kpi{gap:6px}
  .kpi>div{padding:6px 8px}
  .kpi small{display:block;margin-left:0}
  .region-network{padding:11px}
  .region-charge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .region-charge-grid>div:last-child{grid-column:1/-1}
  .region-charge-grid b{font-size:18px}
  .region-connection strong{padding:8px 10px;font-size:13px}
  .region-connection>span b{font-size:14px}
}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font-family:inherit;font-size:12px;padding:8px;border:var(--hairline) solid var(--line);background:var(--card);color:var(--ink2);border-radius:var(--radius-field);cursor:pointer}
.seg button.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg.small{gap:5px;margin-bottom:9px}
.seg.small button{font-size:11px;padding:5px 6px;border-radius:var(--radius-mini)}
/* 可换行的筛选按钮组（费率库）：<900px 时 flex:1 会把按钮压成一字一行，禁止按钮内折行，
   让按钮按文字宽度整颗换到下一行、再均分余宽 */
.seg.wrap{flex-wrap:wrap}
@media (max-width:899px){ .seg.wrap button{white-space:nowrap} }
.rc{width:118px;padding:9px 10px 10px}
.rc-hop{font-size:10.5px;font-weight:600;color:var(--ink3);background:var(--gray-bg);padding:1px 6px;border-radius:var(--radius-pill);flex:0 0 auto}
.rc.on .rc-hop{background:var(--card)}
.rc-line{font-size:12px;font-weight:600;color:var(--ink);margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc.on .rc-line{color:var(--blue-ink)}

/* ==================== 折叠屏展开 / 小平板（600–899px） ====================
   手机布局限宽 480px，折叠屏展开后两侧会空出大片；这一档铺满宽度，主卡与参数改多列，
   路线列表与方案详情仍纵向堆叠（两栏在 700px 左右过窄）。 */
@media (min-width:600px) and (max-width:899px){
  #app{max-width:none}
  nav{max-width:none}
  main{padding:14px 20px 8px}
  .disclaim{padding-left:20px;padding-right:20px}
  .hero{padding:14px 16px}
  .hero-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:end}
  .hero .bar-params,.hero .chan{margin-top:0}
  .hero-main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:stretch}
  .hero-res{display:flex;flex-direction:column;justify-content:center}
  .cmp-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rc{width:132px}
}
/* ==================== 桌面端适配 ==================== */
.topbar{margin-bottom:0}
/* 手机端：路线列表 → 方案详情 → 智能推荐 纵向堆叠（DOM 顺序是 列表、推荐、详情，用 order 调整） */
.layout{display:flex;flex-direction:column}
.col-side{order:1}.col-main{order:2}.col-ai{order:3}
@media (min-width:900px){
  #app{max-width:1320px}
  header{order:0;padding:14px 24px 12px}
  h1{font-size:18px}
  /* 手机端的 margin:0 auto 会让导航作为纵向 flex 子项收缩成一个居中的小盒子，
     桌面端要铺满整行，成为页头下方的标签栏 */
  nav{order:1;position:static;bottom:auto;left:auto;right:auto;max-width:none;margin:0;width:100%;
    border-top:0;border-bottom:var(--hairline) solid var(--line);background:var(--card);backdrop-filter:none;
    justify-content:flex-start;gap:2px;padding:0 24px}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;padding:12px 15px;font-size:13px;
    border-bottom:2px solid transparent;border-radius:0}
  nav button.on{color:var(--blue);border-bottom-color:var(--blue);background:none}
  nav .ic{width:16px;height:16px}
  main{order:2;padding:16px 24px 14px}
  /* 桌面端导航条在页头下方（非固定悬浮），页脚沉到文档底部即可，无需大让位内边距；
     用 footer.disclaim 提高特异性，压过移动端 .disclaim 的导航让位内边距 */
  footer.disclaim{order:3;padding:6px 24px 10px}

  .topbar{display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:12px;
    align-items:stretch;margin-bottom:10px}
  .picker{margin-bottom:0}
  .bar-params{margin-bottom:0}
  .hero{padding:16px 18px}
  .hero-top{display:grid;grid-template-columns:minmax(320px,480px) minmax(220px,320px) minmax(220px,300px);gap:20px;align-items:end}
  .hero .bar-params,.hero .chan{margin-top:0}
  .hero-main{grid-template-columns:minmax(280px,420px) minmax(0,1fr);gap:16px;align-items:stretch}
  .hero-price input{font-size:40px;padding:14px 16px}
  .hero-res{display:flex;flex-direction:column;justify-content:center;padding:12px 18px}
  .hero-v{font-size:40px}
  .cmp-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
  details.adv.boxed{margin-bottom:10px}

  /* 两栏（900～1279px）：左＝路线列表；右列上方＝智能推荐、下方＝方案详情
     ⚠️ 左栏必须 merge 跨两行（grid-row:1/3）。它带 sticky + max-height:calc(100vh - 106px)，
        若只占 grid-row:1，第一行会被它撑到整屏高，而智能推荐也在第一行 ——
        于是推荐卡片下方留出几百像素空白，方案详情（第二行）被推到屏幕外。
        跨行后行高由右列两张卡片决定，推荐与方案之间只剩正常的 grid gap。 */
  .layout{display:grid;grid-template-columns:348px minmax(0,1fr);gap:16px;align-items:start}
  .col-side{grid-column:1;grid-row:1/3;order:0;position:sticky;top:78px;max-height:calc(100vh - 106px);overflow-y:auto;padding-right:4px}
  .col-side::-webkit-scrollbar,.col-ai::-webkit-scrollbar{width:5px}
  .col-side::-webkit-scrollbar-thumb,.col-ai::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--radius-meter)}
  .col-ai{grid-column:2;grid-row:1;order:0;min-width:0}
  .col-main{grid-column:2;grid-row:2;order:0;min-width:0}
  /* 智能推荐隐藏（AI_ENABLED=false）：只剩列表与详情两列，同处第一行 */
  .layout.no-ai .col-side{grid-row:1}
  .layout.no-ai .col-main{grid-row:1}

  .rlist{flex-direction:column;overflow:visible;gap:6px;padding:0}
  .rlist-foot{margin-top:6px}
  .rc{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) 94px;
    grid-template-rows:auto auto;gap:0 10px;align-items:center;padding:10px 12px}
  .rc-top{display:contents}
  .rc-no{grid-column:1;grid-row:1;font-size:12px}
  .rc-hop{grid-column:1;grid-row:2;justify-self:start}
  .rc-line{grid-column:2;grid-row:1;margin:0;font-size:12.5px}
  .rc-meta{grid-column:2;grid-row:2;margin:0}
  .rc-price{grid-column:3;grid-row:1/3;text-align:right;align-self:center;font-size:19px}

  .libgrid{grid-template-columns:1fr 1fr;gap:0 26px}
  .lib-row{min-width:0}
  .segblk .grid{grid-template-columns:repeat(8,1fr)}
  .big{font-size:30px}
  table{font-size:12px}
  th,td{padding:7px 6px}
  #map-view,#fallback{min-height:520px}
  .empty{padding:56px 20px}
}
@media (min-width:1280px){
  #app{max-width:1480px}
  /* 三栏：左＝路线列表，中＝方案详情，右＝智能推荐；左右两栏各自粘性滚动 */
  .layout{grid-template-columns:360px minmax(0,1fr) 340px;gap:18px}
  .col-side{grid-row:1}
  .col-main{grid-column:2;grid-row:1}
  .col-ai{grid-column:3;grid-row:1;position:sticky;top:78px;max-height:calc(100vh - 106px);overflow-y:auto;padding-right:4px}
  .layout.no-ai{grid-template-columns:380px minmax(0,1fr)}
  .libgrid{gap:0 32px}
}
</style>
<script>
/* 首帧同步 <meta name="theme-color">：此处 data-theme 已由 <head> 前面的内联脚本设好、样式表也已解析，
   直接读当前主题的 --system-bar 令牌（本段不写任何颜色字面值），是合法的 #RRGGBB 才写入。
   不等应用脚本（在 <body> 末尾、体积大）：否则非默认主题要先以 #ffffff 露一下浏览器 / 系统状态栏。 */
(function(){
  try{
    var v=getComputedStyle(document.documentElement).getPropertyValue('--system-bar').trim().toUpperCase();
    var m=document.querySelector('meta[name="theme-color"]');
    if(m&&/^#[0-9A-F]{6}$/.test(v)) m.setAttribute('content',v);
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-top">
      <h1>省间路径优选测算</h1>

      <!-- change: grid-map-device-fixes（D1 页头一行化）× 设计系统（PR #28）合流：徽章默认文案缩短
           （公开价格 · 含历史与估算参数→公开数据，title 留全文），帮助改 ？ 圆钮（视觉 25px 与「外观」同高，
           透明扩区限幅 4px 保 44px 内点按区），外观按钮保留——360px 视口四元素仍单行；本地修改态由 lib.js setVerBadge 挂 .mod 换文案 -->

  <footer class="disclaim">本工具为测算与比选辅助，不构成交易建议；实际可交易路径以电力交易中心公布为准。</footer>
  <nav>

  <!-- 参数弹出面板：壳常驻在测算页 #v-calc 之外（测算页整块重画时不会被关掉），正文与价格由 renderParamSheet 刷新（ui/calc.js）。
       手机从底部滑出，≥600px 从右侧滑出 -->
  <div id="param-sheet" class="sheet" aria-hidden="true">
    <div class="sheet-mask" onclick="closeParams()"></div>

      </div>

      </div>
    </div>
  </div>
  <!-- 外观面板：与参数弹层同一套 .sheet 结构（手机底部滑出，≥600px 右侧滑出）；正文由 ui/theme.js 的 renderAppearance 生成，
       改动立即生效并存本机（LS_UI） -->
  <div id="theme-sheet" class="sheet" aria-hidden="true">

      </div>
      <div class="sheet-body" id="theme-body"></div>
    </div>
  </div>
</div>
