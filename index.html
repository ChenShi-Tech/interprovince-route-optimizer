/* 应用内确认框：原生 confirm() 在安卓 WebView（壳未设 WebChromeClient）与 iOS WKWebView
   （未挂 WKUIDelegate）中都不显示、且恒按「取消」返回 false，故三端统一自绘。
   返回 Promise<boolean>；已有弹框未关闭时再次调用直接按「取消」结算，避免叠层。 */
let _cfmOpen=false;
function uiConfirm(title,msg,okText,cancelText){
  if(_cfmOpen) return Promise.resolve(false);
  _cfmOpen=true;
  return new Promise(res=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:4000;background:var(--scrim-dialog);display:flex;align-items:center;justify-content:center;padding:28px';
    ov.innerHTML=`<div role="dialog" aria-modal="true" style="background:var(--card);border-radius:var(--radius-dialog);max-width:320px;width:100%;padding:18px 16px 14px;box-shadow:var(--shadow-dialog)">
      <div style="font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:8px">${esc(title)}</div>
      <div style="font-size:12.5px;color:var(--ink2);line-height:1.7;white-space:pre-line">${esc(msg)}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn ghost" data-r="0" style="flex:1">${esc(cancelText)}</button>
        <button class="btn" data-r="1" style="flex:1;font-size:14px;padding:10px">${esc(okText)}</button>
      </div></div>`;
    const done=ok=>{ _cfmOpen=false; ov.remove(); document.removeEventListener('keydown',onKey); res(ok); };
    const onKey=e=>{ if(e.key==='Escape') done(false); };
    ov.addEventListener('click',e=>{
      const b=e.target.closest('button[data-r]');
      if(b) done(b.dataset.r==='1');
      else if(e.target===ov) done(false);   // 点遮罩视为取消
    });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(ov);
    ov.querySelector('button[data-r="1"]').focus();
  });
}
/* ================= 存储 ================= */
/* 存储故障可见化（spec: local-persistence）：写入失败（配额满/隐私模式）只置一次性标记，
   由测算页渲染一条常驻提示，会话内不重复弹。渲染路径内禁止任何 setItem 调用（防循环）。 */
let _storageBroken=false;
function loadStored(){
  try{
    const a=localStorage.getItem(LS_LIB);
    if(a){
      const s=JSON.parse(a);
      // REQ-602：本地价格覆盖必须与当前价格数据同版本（priceVersion），
      // 否则由用户决定丢弃或暂留——静默使用旧覆盖会算出过期结果
      if(s.ch&&s.ch.length===CH.length){
        if(s.pv&&s.pv===PRICE_VERSION){ CH=s.ch; }
        else{
          // REQ-602：priceVersion 不一致必须由用户决定丢弃或暂留。确认框是异步的，
          // 先按保守口径暂留并置 _libStale（费率库会提示核对，等同原「取消」分支），
          // 用户选「丢弃」再回滚核定值并重算
          CH=s.ch; state._libStale=true;
          uiConfirm('费率本地修改版本不一致','本地费率修改基于旧版价格数据（priceVersion 不一致），继续使用可能算出过期结果。','丢弃本地修改','暂保留').then(ok=>{
            if(!ok) return;
            localStorage.removeItem(LS_LIB);
            CH=DATA.CH.map(c=>({...c})); state._libStale=false;
            state._res=solveState(); renderCalc();
          });
        }
      }
    }
    const b=localStorage.getItem(LS_LAST);
    if(b){
      const s=JSON.parse(b);
      const sameBuild=(s._bt===BUILD_TIME);   // 价格数据版本变化时丢弃过期的本地价格改动
      delete s._bt;
      // 旧版现货界面存档迁移到中长期节点交付口径，保留用户价格。
      if(!s.marketMode){ s.marketMode='mlt'; s.includeDstCost=false; s.regionChargeMode='network'; }
      if(Number.isFinite(s.pGen)) s.pGenManual=true;
      // 已下线的输入（受端目标交付价、跳数/绕行、排序口径、交付日期）不从旧存档恢复，一律取固定口径
      for(const k of ['pDst','pDstManual','maxHops','maxDetour','sortBy','tradeDate']) delete s[k];
      // 旧版存档会把当时的默认网损选项一并存下，无法区分是否手选；默认口径版本变化时按新默认重置这两项
      if(s._pdv!==PARAM_DEFAULTS_VER){ delete s.originLossMode; delete s.regionLossMode; }
      delete s._pdv;
      Object.assign(state,s);
      state._stalePrice=!sameBuild;
      // FR-1 边界：FR-1 之前的旧存档没有上限钳制，恢复时统一钳一次，
      // 保证"杀进程重开后输入为合法值"对历史存档同样成立（PRD AC3）
      state.pGen=sanNum(state.pGen,NUM_LIMITS.quote);
      state.pNet=sanNum(state.pNet,NUM_LIMITS.quote);
      state.fund=sanNum(state.fund,NUM_LIMITS.quote);
      state.qty=sanNum(state.qty,NUM_LIMITS.qty); if(!(state.qty>0)) state.qty=NUM_LIMITS.qty.fallback;
      state.hours=sanNum(state.hours,NUM_LIMITS.hours); if(!(state.hours>0)) state.hours=NUM_LIMITS.hours.fallback;
      state.capValue=sanNum(state.capValue,NUM_LIMITS.capacity); if(!(state.capValue>0)) state.capValue=0;
      state.capQty=sanNum(state.capQty,NUM_LIMITS.annualQty); if(!(state.capQty>0)) state.capQty=0;
    }
    const m=localStorage.getItem(LS_MAP); if(m) Object.assign(state,JSON.parse(m));
  }catch(e){}
}
function saveLib(){ try{localStorage.setItem(LS_LIB,JSON.stringify({ch:CH,pv:PRICE_VERSION,at:BUILD_TIME})); state._libStale=false; }catch(e){ _storageBroken=true; } }
function saveLast(){
  try{
    // tradableOnly（REQ-203）与 occPct（REQ-302）为会话内口径，按 PRD 不持久化；
    // 运行时产物同样不入档：_res 含 rows+byA/byB/byC 四份引用（JSON 序列化不去重，
    // 最坏省对达 12MB，撞穿 localStorage 配额后所有持久化会静默失效），_ai 挂着同一份
    // 结果，_libStale/_stalePrice 是会话内标志。启动时 boot 无条件重算 _res，剥离无消费方。
    const s=Object.assign({},state,{_bt:BUILD_TIME,_pdv:PARAM_DEFAULTS_VER});
    delete s.tradableOnly; delete s.occPct; delete s.tradeDate;
    delete s._res; delete s._ai; delete s._libStale; delete s._stalePrice;
    delete s.mapSec; delete s.mapQ; delete s.mapFocusLL; delete s.mapRegion;   // 会话内视图状态不入档
    delete s.mapView; delete s.tdDegradeNote;   // change: grid-map-device-fixes：触摸视野与降级说明同为会话内状态
    delete s.mapNet;   // grid-map-single-route-and-fixes：旧 LS_MAP 的残键不入档
    localStorage.setItem(LS_LAST,JSON.stringify(s));
  }catch(e){ _storageBroken=true; }
}
function saveMap(){ try{localStorage.setItem(LS_MAP,JSON.stringify({mapProvider:state.mapProvider,tiandituKey:state.tiandituKey}));}catch(e){ _storageBroken=true; } }

/* ===== src/app/algo/network.js ===== */
/* 图结构与几何工具。
 *
 * 纯函数：不读取任何全局状态。经纬度访问通过 geo 参数注入，
 * 便于 Android 端复用同一份实现。
 *
 * geo 契约：{ lngLatOf(channel, 'from'|'to') -> [lng,lat] | null,
 *            provLngLat(provinceCode)        -> [lng,lat] | null }
 */

/** 由通道数组构建邻接表。
 *
 *  专项工程（bidir=false）只按核定的送受端方向挂一次：发改价格规〔2025〕1490号附件4第二条，
 *  专项工程是「送受端相对明确、潮流方向相对固定」的工程，反向交易在省间现货中不存在。
 *  省间联络线（bidir=true）可双向通行，以两个方向各挂一次。 */
function buildAdj(edges){
  const adj={};
  edges.forEach(e=>{
    (adj[e.from]||(adj[e.from]=[])).push({to:e.to,e});
    if(e.bidir) (adj[e.to]||(adj[e.to]=[])).push({to:e.from,e});
  });
  return adj;
}

/** 边 e 位于省 code 一侧的端点坐标。
 *  按「实际行进方向」取端：反向行进的联络线，其存储的 from 端在对侧省，不能直接用存储方向。 */
function sideOf(e, code, geo){ return geo.lngLatOf(e, e.from===code?'from':'to'); }

/** 路径的唯一标识。
 *  ⚠️ 必须用节点序列，不能用边对象的 from/to —— 对向通行的边，
 *  其存储方向与行进方向相反，用边拼键会把 A→B→C 与 C→B→A 误判为同一条。 */
function keyOf(nodes){ return nodes.join('>'); }

/** 经纬度近似距离（度数，已按纬度余弦修正）。 */
function distDeg(a,b){
  const dx=(a[0]-b[0])*Math.cos((a[1]+b[1])/2*Math.PI/180), dy=a[1]-b[1];
  return Math.sqrt(dx*dx+dy*dy);
}

/** 两点大圆距离，单位 km。 */
function havKm(a,b){
  if(!a||!b) return 0;
  const R=6371, r=Math.PI/180;
  const dp=(b[1]-a[1])*r, dl=(b[0]-a[0])*r;
  const s=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}

/** 绕行度 = 路径实际里程 ÷ 起终点直线距离。
 *  用于剔除「绕行大半个中国」的荒谬组合；单段路径恒为 1。 */
function detourOf(nodes, edges, geo){
  if(nodes.length<3) return 1;
  let d=0;
  for(let i=0;i<edges.length;i++){
    const a=geo.lngLatOf(edges[i],'from'), b=geo.lngLatOf(edges[i],'to');
    if(a&&b) d+=distDeg(a,b);
  }
  // 起点取首段在出发省一侧的端点（按实际行进方向），终点取目的省中心
  const origin=sideOf(edges[0],nodes[0],geo)||geo.provLngLat(nodes[0]);
  const s=distDeg(origin, geo.provLngLat(nodes[nodes.length-1]));
  return s<1e-6?1:d/s;
}

/* ===== src/app/algo/cost.js ===== */
/* 中长期交付成本模型，纯函数。以合同报价边界和公开价格为输入。
 * 送出省费仅在起点且报价未含时计一次，区域共用接口不独立收费/逐段计损。
 * 独立工程费用按出口电量折算（1490号附件4第十八条）；通过率连乘。
 * S14现货规则4.3.1仅用于交叉验证数学折算，不把其结算条款套用于中长期。
 * 区域电量价取1077号附件2（不含网损，容量分摊不另加）。区域适用范围待合同确认。
 * ctx.sourceQuote: plant/export；originLossMode: included/separate。
 * env.buyerRegionRequired: 公告是否要求专项工程落地后仍计受端区域。
 */

/** 某省所在区域电网的电量电价（元/兆瓦时）；区域无核定价（南方）时为 0。 */
function regionRate(env, code){
  const rt=env.REGION_OF[code];
  return rt ? (env.RG[rt]||0)*1000 : 0;   // 元/kWh → 元/MWh
}

/** 段的输电价（元/兆瓦时），按实际行进方向取值。
 *  专项工程的核定价与方向无关；联络线按送出省输电价格口径计价，反向行进时送端省变了，取对侧省的 tRev。 */
function tariffOf(e, fromCode){
  return (e.bidir && fromCode===e.to && e.tRev!=null) ? e.tRev : e.t;
}

/** 交易起点的送出省价格（元/兆瓦时），只在路径首段计一次。
 *  regional 通道的 t/tRev 是送出省参考价，不是该接口的独立输电价。
 *  双向专项工程反向行进时取 sendFeeRev。 */
function sendFeeOf(e, fromCode){
  if(e.regional) return tariffOf(e, fromCode);
  return (e.bidir && fromCode===e.to && e.sendFeeRev!=null) ? e.sendFeeRev : (e.sendFee||0);
}

/** 区域共用交流网的接口是路径抽象，不把估算线损逐条计入交易报价。
 *  专项工程及背靠背直流仍按自身口径计费；物理链始终保留原线损供容量估算。 */
function billingLossOf(env, e){
  const region=env.REGION_OF[e.from];
  const pooled=e.regional && e.type==='AC' && region && region===env.REGION_OF[e.to];
  return (e.incLoss || pooled)?0:(e.loss||0);
}

/** 近似边权：只决定路径枚举的顺序，不参与最终计价。
 *  用线性近似把线损折成成本，避免用乘法项直接做最短路。
 *  送出省价格只在起点计入；区域费需按整条路径去重，留给精确计价。 */
function approxW(env, e, fromCode, toCode){
  const rho = billingLossOf(env,e);
  return (e.regional?0:tariffOf(e, fromCode))
    +(fromCode===env.source && env.sourceQuote!=='export'?(env.srcSendFee ?? sendFeeOf(e, fromCode)):0)+rho/100*env.pGen;
}

/** 对一条路径做精确计价。
 *
 *  两条系数链：
 *    物理链 sufP —— 用全部段已录入线损率（含估算），算功率、容量占用与物理损耗电量；
 *    计费链 sufT —— 「含输电环节线损」的段（incLoss）线损按 0 计（含损价格不重复计损），区域共用交流接口也按 0 计，其余段按已录入线损率。
 *  段前系数 = 1 / Π(该段及之后各段的通过率)，段后系数 = 1 / Π(之后各段的通过率)。
 *  每段输电费按「段后」电量计（按出口计量约定），送出省段按其出口电量（= 本段入口电量）计。
 */
function evalPath(path, ctx, env){
  const edges=path.edges, nodes=path.nodes, n=edges.length;
  const buyerRegion=env.REGION_OF[nodes[n]];
  const LOSS=env.LOSS_OF||{};
  const regionExit=new Map();
  if(env.includeRegion) edges.forEach((e,i)=>{
    const region=env.REGION_OF[nodes[i+1]];
    if(e.regional && region) regionExit.set(region,i);
  });
  if(env.includeRegion && buyerRegion && env.buyerRegionRequired!==false) regionExit.set(buyerRegion,n-1);
  // 一个区域收费单元一个网损环节；绝不把区域损耗复制到每个交流接口。
  const regionItems=[...regionExit].map(([region,index])=>{
    const source=(env.RLOSS||{})[region]||{};
    const mode=ctx.regionLossMode||'exclude';
    const raw=mode==='historical'?source.historicalPct
      :mode==='custom'?(ctx.regionLossRates||{})[region]
      :mode==='verified'?source.currentPct:null;
    const known=raw!=null && Number.isFinite(raw) && raw>=0 && raw<100;
    return {region,index,rate:(env.RG[region]||0)*1000,pct:known?raw:0,
      status:known?(mode==='verified'?'verified':mode):'missing',source};
  });
  const after=Array(n).fill(1);
  regionItems.forEach(r=>{after[r.index]*=1-r.pct/100;});
  const sufP=new Array(n+1), sufT=new Array(n+1); sufP[n]=1; sufT[n]=1;
  for(let i=n-1;i>=0;i--){
    sufP[i]=sufP[i+1]*(1-(edges[i].loss||0)/100);
    sufT[i]=sufT[i+1]*after[i]*(1-billingLossOf(env,edges[i])/100);
  }
  const D=sufT[0], genQty=1/D, lossQty=genQty-1;
  const Dphys=sufP[0];
  const qty=ctx.qty, h=ctx.hours;
  // qty 始终是买方省间节点交付电量；到户价另以 consumerQty 作为金额基数。
  const toMW=q=>qty/h*q;
  const toMWh=q=>qty*q;
  regionItems.forEach(r=>{
    r.qOut=1/sufT[r.index+1]; r.qIn=r.qOut/(1-r.pct/100);
    r.fee=r.rate*r.qOut; r.lossMwh=qty*(r.qIn-r.qOut);
  });

  let trans=0, regTransit=0, sendTotal=0, dist=0, segLossMwh=0, vsCount=0;
  // REQ-302：中长期占用——容量校验按 cap×(1−占用比例) 扣减（默认 0，不持久化）
  const occFactor=1-(ctx.occPct||0)/100;
  const vset=new Set(), tset=new Set(), rset=new Set([env.REGION_OF[nodes[0]]]), stset=new Set();
  const segs=edges.map((e,i)=>{
    const q=1/sufT[i], qOut=1/(sufT[i+1]*after[i]);        // 计费链
    const qP=1/sufP[i], qOutP=1/sufP[i+1];      // 物理链
    const t=e.regional?0:tariffOf(e,nodes[i]);
    // 送端电站专属送出价（1077号附件1 川滇等表注4 对特定电站 / 额度另定）：用户选定时覆盖通用送出价
    const sf0=i===0 && ctx.sourceQuote!=='export'?(ctx.srcSendFee ?? sendFeeOf(e,nodes[i])):0;
    const fee=t*qOut;                           // S14 4.3.1：输电价 × 段后电量
    const sf=sf0*q;                             // 送出省段：出口电量 = 本段入口电量
    const rg=regionItems.filter(r=>r.index===i && r.region!==buyerRegion).reduce((a,r)=>a+r.fee,0);
    trans+=fee; regTransit+=rg; sendTotal+=sf;
    const a=env.geo.lngLatOf(e,'from'), b=env.geo.lngLatOf(e,'to');
    const crow=havKm(a,b);
    const km=e.lenKm||crow;
    const lossMwh=toMWh(qP-qOutP);
    segLossMwh+=lossMwh; dist+=km;
    vset.add(e.kv); tset.add(e.type); rset.add(env.REGION_OF[nodes[i+1]]);
    if(e.stFrom) stset.add(e.stFrom); if(e.stTo) stset.add(e.stTo);
    if(e.type==='DC') vsCount++;
    return {
      e,t,sf0,q,qOut,qP,qOutP,fee,rg,sf,a:nodes[i],b:nodes[i+1],
      billLossPct:billingLossOf(env,e),
      km, crow, kmEst:!e.lenKm,
      inMW:toMW(qP), outMW:toMW(qOutP), lossMW:toMW(qP-qOutP),
      inMWh:toMWh(qP), outMWh:toMWh(qOutP), lossMwh,
      billLossMwh:toMWh(q-qOut),
      lossCost:toMWh(q-qOut)*ctx.pGen,
      feeYuan:qty*fee, rgYuan:qty*rg, sfYuan:qty*sf,
      util:e.cap? toMW(qP)/(e.cap*occFactor) : null,
      headroom:e.cap? e.cap*occFactor-toMW(qP) : null,
    };
  });
  const regBuyer = regionItems.filter(r=>r.region===buyerRegion).reduce((a,r)=>a+r.fee,0);   // 买方区域电量电价 × 交付电量
  const regFee = regTransit + regBuyer;
  const regionLossMissing=regionItems.filter(r=>r.status==='missing').map(r=>r.region);
  const g=ctx.lossBearer;
  const cGen=ctx.pGen, cLossBuyer=cGen*g*lossQty, cSend=sendTotal, cTrans=trans, cReg=regFee;
  const exportLossPct=ctx.srcExportLossPct ?? (LOSS[nodes[0]]||{}).exportLoss;
  const exportLossQty=exportLossPct!=null ? genQty*(exportLossPct/100)/(1-exportLossPct/100) : 0;
  const cExportLoss=cGen*exportLossQty;
  const originSeparate=ctx.sourceQuote!=='export' && ctx.originLossMode==='separate';
  const cOriginLoss=originSeparate?cExportLoss:0;
  const border=cGen+cLossBuyer+cSend+cTrans+cReg+cOriginLoss;
  // 受端省内费用：省网输配电价、基金附加、上网环节线损费用（1077号附件1 注3，在输配电价外单列）。
  // 上网环节线损：用户拿到 1 MWh 需从省界买入 1/(1−ρ) MWh，费用 = 省界价 × ρ/(1−ρ)。
  const dst=ctx.includeDstCost!==false;
  // 受端电网主体可选（河北/冀北、蒙西/蒙东、陕西/榆林、深圳等分表，注3 线损率随主体不同）：给出时覆盖省默认值
  const inLossPct=ctx.dstInLossPct ?? (LOSS[nodes[n]]||{}).inLoss;
  const cInLoss=(dst && inLossPct!=null) ? border*(inLossPct/100)/(1-inLossPct/100) : 0;
  const cNet=dst?ctx.pNet:0;
  const cFund=dst?ctx.fund:0;
  // 到户扩展的两项用户侧费用（元/到户MWh，缺省 0）：两部制容（需）量电费按用户负荷假设分摊、系统运行费手填
  const cCap=dst?(ctx.dstCapFee||0):0;
  const cSysOp=dst?(ctx.dstSysOpFee||0):0;
  const landed=border+cInLoss+cNet+cFund+cCap+cSysOp;
  const consumerQty=dst && inLossPct!=null ? qty*(1-inLossPct/100) : qty;
  const amountQty=dst?consumerQty:qty;
  const channelOnly=cSend+cTrans;   // 口径二：过网费 = 送端省内段 + 跨省通道费，不含网损、区域电网费与省网费用
  // 以同一费用约定反求送端报价；不是现货边际价，也不是卖方利润。未给受端目标交付价时为 null。
  const quoteFactor=1+g*lossQty+(originSeparate?exportLossQty:0);
  const maxSourceQuote=ctx.pDst==null ? null : (ctx.pDst-cSend-cTrans-cReg)/quoteFactor;
  const senderNet=maxSourceQuote; // 保留旧字段名供排序/端侧兼容，新语义见数据契约。
  const deliverMW=qty/h;
  const segLd=segs.map(s=>({name:s.e.n,mw:s.inMW,cap:s.e.cap,effCap:s.e.cap?s.e.cap*occFactor:null,over:s.e.cap? s.inMW>s.e.cap*occFactor : false}));
  const maxLoad=Math.max(...segLd.map(s=>s.cap&&occFactor?s.mw/(s.cap*occFactor):0));
  const overSeg=segLd.filter(s=>s.over);
  // 断面校验：同一断面内各段入口功率之和与该断面限额比对
  const secHits=[];
  for(const sec of env.SEC){
    if(!sec.edges||!sec.edges.length) continue;
    const inSec=segs.filter(s=>sec.edges.some(k=>s.e.n.includes(k)||(s.e.fn||'').includes(k)));
    if(!inSec.length) continue;
    const tot=inSec.reduce((a,s)=>a+s.inMW,0);
    secHits.push({sec, mw:tot, over:tot>sec.limit, util:tot/sec.limit,
      members:inSec.map(s=>s.e.n)});
  }
  const secOver=secHits.filter(h=>h.over);
  const feasible=!overSeg.length && !secOver.length;

  const genMWh=toMWh(genQty), lossMwh=toMWh(lossQty);
  const genMWhPhys=toMWh(1/Dphys), lossMwhPhys=toMWh(1/Dphys-1);
  // 直线距离按实际行进方向取首段出发端与末段到达端
  const straight=havKm(sideOf(edges[0],nodes[0],env.geo), sideOf(edges[n-1],nodes[n],env.geo));
  const yuan={
    gen:cGen*amountQty, send:cSend*amountQty, trans:cTrans*amountQty,
    reg:cReg*amountQty, loss:cLossBuyer*amountQty,
    inLoss:cInLoss*amountQty, net:cNet*amountQty, fund:cFund*amountQty, originLoss:cOriginLoss*amountQty,
    cap:cCap*amountQty, sysOp:cSysOp*amountQty,
  };
  yuan.total=yuan.gen+yuan.send+yuan.trans+yuan.reg+yuan.loss+yuan.inLoss+yuan.net+yuan.fund+yuan.originLoss+yuan.cap+yuan.sysOp;
  const tiers={gov:0,grid:0,region:0,est:0};
  edges.forEach(e=>{tiers[e.tier]=(tiers[e.tier]||0)+1;});
  const unverified=edges.filter(e=>e.tier!=='gov').length;

  return {nodes,edges,hops:n,D,Dphys,genQty,lossQty,trans,regFee,regBuyer,regTransit,segs,segLd,overSeg,maxLoad,secHits,secOver,feasible,
    detour:detourOf(nodes,edges,env.geo), landed, border, channelOnly, senderNet, yuan,
    qty, h, consumerQty, amountQty, deliverMW, genMWh, lossMwh, genMWhPhys, lossMwhPhys, segLossMwh,
    inLossPct, exportLossPct, cExportLoss, exportLossQty, cOriginLoss, maxSourceQuote, quoteFactor,
    dist, straight, dcCount:vsCount, acCount:n-vsCount,
    kvList:[...vset].filter(Boolean), typeList:[...tset], regionList:[...rset].filter(Boolean),
    stationList:[...stset], tiers, unverified, buyerRegion, regionLossMissing, regionItems,
    priceComplete:regionItems.every(r=>r.status==='verified'),
    capacityStatus:overSeg.length || secOver.length ? 'exceeded' : 'unconfirmed',
    comp:{gen:cGen,loss:cLossBuyer,send:cSend,trans:cTrans,reg:cReg,inLoss:cInLoss,net:cNet,fund:cFund,originLoss:cOriginLoss,cap:cCap,sysOp:cSysOp},
    capUnknown:edges.filter(e=>e.cap==null || e.capBasis==='unknown' || e.capBasis==='estimate').length,
    capEqUsed:edges.filter(e=>e.capEq!=null).length};
}

/* ===== src/app/algo/paths.js ===== */
/* 路径枚举。
 *
 * 依据《省间电力现货交易规则》3.2.2：
 *   「同一交易路径不重复经过同一交易节点」→ 只枚举简单路径；
 *   「优先选择节点间输电价格（含网损折价）最低的交易路径」→ 邻居按近似成本升序展开，
 *   使低成本路径优先被发现，达到枚举上限时保留最有价值的候选，而不是任意截断。
 */

/** 枚举 src→dst 的全部简单路径（不重复经过同一节点）。
 *
 * @param adj      邻接表（见 network.js buildAdj）
 * @param src,dst  起止省代码
 * @param maxHops  跳数上限（段数）
 * @param cap      枚举上限，防止组合爆炸
 * @param weightOf (adjEntry, currentNode) => number，决定邻居展开顺序
 */
function enumPaths(adj,src,dst,maxHops,cap,weightOf){
  const out=[], visited=new Set([src]), nodes=[src], edges=[];
  let hitCap=false;   // REQ-601：区分「提前截断」与「自然枚举完恰好 cap 条」
  const ord={};
  for(const k in adj) ord[k]=adj[k].slice().sort((a,b)=>weightOf(a,k)-weightOf(b,k));
  (function dfs(u){
    if(hitCap) return;
    if(u===dst){
      if(out.length===cap){ hitCap=true; return; }
      out.push({nodes:nodes.slice(),edges:edges.slice()}); return;
    }
    if(edges.length>=maxHops) return;
    for(const nb of ord[u]||[]){
      if(visited.has(nb.to)) continue;
      if(nb.e.originOnly && u!==src) continue;   // 点对网电厂送出工程只能作首段，不作过境通道
      visited.add(nb.to); nodes.push(nb.to); edges.push(nb.e);
      dfs(nb.to);
      edges.pop(); nodes.pop(); visited.delete(nb.to);
      if(hitCap) return;
    }
  })(src);
  out.hitCap=hitCap;
  return out;
}

/* ===== src/app/algo/solve.js ===== */
/* 求解编排：把输入与数据组装成一次完整测算。
 *
 * 这是算法层唯一的入口，也是安卓端需要复刻的全部逻辑：
 *   solve(input, data) -> { rows, byA, byB, byC, bestA, bestB, bestC, ... } 或 { err }
 *
 * 流程：建图 → 枚举简单路径 → 绕行度筛选 → 逐条精确计价 → 三口径排序 → 可行性过滤。
 *
 * input 契约（全部来自用户输入）：
 *   from, to            送端 / 受端省代码
 *   qty, hours          电量 MWh / 时段 h
 *   pGen                送端报价 元/MWh
 *   pDst                可选：受端目标交付价 元/MWh；缺省时不反推可接受送端报价（senderNet=null，不产出 byC）
 *   pNet, fund          受端省网输配电价 / 政府性基金及附加 元/MWh
 *   lossBearer          网损承担比例（受端承担 1 / 各半 0.5 / 送端承担 0）
 *   maxHops             跳数上限（1～MAX_HOPS）
 *   maxDetour           可选：绕行度上限；null / 缺省 = 不限
 *   includeRegion       是否计入区域电网费
 *   includeDstCost      是否计入受端省内费用（false = 只算到受端省界）
 *   sortBy, showBad     排序口径（A/B/C）/ 是否显示越限方案
 *   mustHave            必经通道 id 数组（「通道组件」筛选），空数组或缺失 = 不筛选
 *   以下均为可选，缺省时与旧口径完全一致：
 *   dstInLossPct        受端省内上网环节线损率 %（按所选受端电网主体，覆盖省默认值）；另计线损费用
 *   dstQtyLossPct       可选：仅用于终端电量折算的受端上网环节线损率 %。受端主体电价已含线损费用时
 *                       （如深圳，1077号附件1 第22页注2）使用：终端电量按 (1-ρ) 折算，不单列线损费用行。
 *                       省界及以前各项的金额仍按节点交付电量实付（单价改按到户电量表述），
 *                       landed = 省界价/(1-ρ) + 受端各项。缺省（不传）时与旧口径完全一致。
 *   dstBilling          受端计价方式 'single' | 'twopart'（只用于缺项提示，输配电价仍由 pNet 传入）
 *   dstCapFee           两部制容（需）量电费分摊 元/到户MWh（用户负荷假设下的估算）
 *   dstSysOpFee         系统运行费 元/到户MWh（手填；null = 缺项）
 *   srcSendFee          送端电站专属送出价 元/MWh（覆盖通用送出省输电价格）
 *   srcExportLossPct    与之配套的送省外上网环节线损率 %（覆盖省默认值）
 *   srcSendNote         专属送出价的范围说明（进入适用条件提示）
 *
 * data 契约（静态数据）：
 *   CH, PV, SEC, RG, REGION_OF, geo, name
 */
const ENUM_CAP = 800;   // 枚举上限：防止组合爆炸，同时保证低成本方案优先生成
const MAX_HOPS = 10;    // 跳数硬上限：界面固定取此值，不再提供选项（2026-09-17 全省对实测未触发 ENUM_CAP）
const PROBE_CAP = 16;   // 单通道可达性探测的取数上限：只用于补全候选集/通道清单，远小于主枚举上限

function solve(input, data){
  if(input.marketMode && input.marketMode!=='mlt') return {err:'省间现货入口待拓展，当前仅提供中长期交付成本与报价测算'};
  const env={
    REGION_OF: data.REGION_OF,
    RG: data.RG,
    LOSS_OF: data.LOSS_OF || {}, RLOSS:data.RLOSS || {},
    SEC: data.SEC,
    geo: data.geo,
    includeRegion: input.includeRegion !== false,
    buyerRegionRequired: input.regionChargeMode==='buyer',
    sourceQuote: input.sourceQuote || 'plant',
    pGen: input.pGen,
    source: input.from,
    srcSendFee: input.srcSendFee ?? null,
  };
  const ctx={
    pGen: input.pGen, pDst: input.pDst ?? null, pNet: input.pNet, fund: input.fund,
    lossBearer: input.lossBearer, qty: input.qty, hours: input.hours,
    includeDstCost: input.includeDstCost !== false,
    sourceQuote: input.sourceQuote || 'plant', originLossMode: input.originLossMode || 'included',
    regionLossMode:input.regionLossMode||'exclude', regionLossRates:input.regionLossRates||{},
    occPct: Math.min(90, Math.max(0, +input.occPct || 0)),   // REQ-302：中长期占用 %
    dstInLossPct: input.dstInLossPct ?? null, dstQtyLossPct: input.dstQtyLossPct ?? null,
    dstCapFee: input.dstCapFee ?? 0, dstSysOpFee: input.dstSysOpFee ?? null,
    srcSendFee: input.srcSendFee ?? null, srcExportLossPct: input.srcExportLossPct ?? null,
  };
  const { from, to } = input;
  const N = data.name;

  if(!['plant','export'].includes(ctx.sourceQuote)||!['included','separate'].includes(ctx.originLossMode)||!['network','buyer'].includes(input.regionChargeMode||'network')) return {err:'报价边界或区域计费模式无效'};

  if(!data.PV[from] || !data.PV[to]) return {err:'省份代码无效'};
  if(from === to) return {err:'送端与受端不能相同'};

  for(const k of ['qty','hours','pGen','lossBearer','maxHops']){
    if(!Number.isFinite(input[k])) return {err:'参数 '+k+' 必须为有限数值'};
  }
  // 可选参数：缺省表示不反推 / 不限绕行，但给了就必须是有限数值
  for(const k of ['pDst','maxDetour']){
    if(input[k]!=null && !Number.isFinite(input[k])) return {err:'参数 '+k+' 必须为有限数值'};
  }
  const hasDst = input.pDst!=null;
  for(const k of ['dstInLossPct','dstQtyLossPct','srcExportLossPct']){
    if(input[k]!=null && (!Number.isFinite(input[k])||input[k]<0||input[k]>=100)) return {err:'参数 '+k+' 须为 0（含）到 100（不含）之间的百分数'};
  }
  for(const k of ['dstCapFee','dstSysOpFee','srcSendFee']){
    if(input[k]!=null && (!Number.isFinite(input[k])||input[k]<0)) return {err:'参数 '+k+' 须为非负有限数值'};
  }
  if(input.dstBilling!=null && !['single','twopart'].includes(input.dstBilling)) return {err:'受端计价方式无效'};
  if(input.qty<=0 || input.hours<0.25) return {err:'电量须大于 0，时长不得小于 0.25 小时'};
  if(input.lossBearer<0 || input.lossBearer>1) return {err:'网损承担比例须在 0 到 1 之间'};
  if(!Number.isInteger(input.maxHops)||input.maxHops<1||input.maxHops>MAX_HOPS||(input.maxDetour!=null&&input.maxDetour<1)) return {err:'路径范围无效'};
  if(input.includeDstCost!==false && (!Number.isFinite(input.pNet)||!Number.isFinite(input.fund))) return {err:'受端输配电价、基金须明确填写；缺项不能静默按零结算'};
  if(!['exclude','historical','custom','verified'].includes(ctx.regionLossMode)) return {err:'区域网损模式无效'};
  if(ctx.regionLossMode==='custom' && Object.values(ctx.regionLossRates).some(v=>v!=null && (!Number.isFinite(v)||v<0||v>=100))) return {err:'区域网损率须为 0（含）到 100（不含）之间的百分数'};
  if(input.occPct!=null && (!Number.isFinite(input.occPct)||input.occPct<0||input.occPct>90)) return {err:'占用比例须在 0 到 90 之间'};
  const date=input.tradeDate || (data.VALIDITY||{}).reviewedAt || '2026-09-17';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(Date.parse(date)) || new Date(date).toISOString().slice(0,10)!==date) return {err:'交易日期无效'};
  if(data.VALIDITY && date<data.VALIDITY.provinceFrom) return {err:'当前价库仅支持 2026-08-01 起的价格口径，尚未收录此前完整历史费率'};
  if(input.includeDstCost!==false && data.PV[to].effectiveFrom && date<data.PV[to].effectiveFrom) return {err:N(to)+' 受端输配电价自 '+data.PV[to].effectiveFrom+' 起适用，当前日期不可提前使用；可切换为省间节点交付口径'};
  const invalid=data.CH.find(e=>(e.loss!=null && (!Number.isFinite(e.loss)||e.loss<0||e.loss>=100)) || (e.cap!=null && (!Number.isFinite(e.cap)||e.cap<=0)) || (e.t!=null&&!Number.isFinite(e.t)));
  if(invalid) return {err:'费率库参数无效：'+invalid.n+'，请恢复或修正费率库'};

  // REQ-203：仅按已确认可交易通道——开启后排除 tradable===false 的交流联络线
  // 价格待核通道（南网云广/普侨/高肇/兴安/禄高肇等物理直流，无发改委独立核价文件、
  // 收费并入 842 号「云南送广东」等聚合交易成分）一律不参与枚举：
  // 纳入会按 0 元过网费参与最短路，产出价格虚低的错误方案。清单回传给界面显式提示。
  const pendingChannels = data.CH.filter(c=>c.pricePending)
    .map(c=>({id:c.id, n:c.n, from:c.from, to:c.to, kv:c.kv, reason:'未检索到独立核定输电价格，收费并入对应聚合交易成分'}));
  const CHpool = data.CH.filter(c=>!c.pricePending)
    .filter(c=>(!input.tradableOnly || c.tradable!==false) && (!c.eff || c.eff<=date));
  const adj = buildAdj(CHpool);
  if(!adj[from]) return {err:N(from)+' 暂无接入的跨省通道', pendingChannels};

  const maxHops = input.maxHops;
  // 按跳数由少到多逐层枚举（迭代加深）：单次深度优先在 ENUM_CAP 处截断时，会被零费用的区域联络线排列占满，
  // 直达专项工程反而进不了候选集（2026-09-17 四川→江苏漏掉锦苏直流）。逐层合并保证较少跳数的路径先完整入选。
  const weightOf = (nb,u)=>approxW(env, nb.e, u, nb.to);
  const raw = [], seenPath = new Set();
  let hitCap = false;
  for(let h=1; h<=maxHops; h++){
    // 累计候选已达上限：后续层不再枚举——同样是「提前截断」，只退出不置位会让 truncated 出现假阴性（M3）
    if(raw.length>=ENUM_CAP){ hitCap = true; break; }
    const part = enumPaths(adj, from, to, h, ENUM_CAP, weightOf);
    for(const p of part){
      const k = pathKeyOf(p);
      if(!seenPath.has(k)){ seenPath.add(k); raw.push(p); }
    }
    if(part.hitCap){ hitCap = true; break; }
  }
  if(!raw.length){
    return {err:'在 '+maxHops+' 段以内没有 '+N(from)+' 到 '+N(to)+' 的连通路径', pendingChannels};
  }
  const truncated = hitCap;   // REQ-601：枚举因 cap 提前返回（或在 cap 处停层）时置位

  const maxDetour = input.maxDetour;
  const keepPath = p => maxDetour==null || detourOf(p.nodes, p.edges, env.geo) <= maxDetour;
  const kept = raw.filter(keepPath);
  if(!kept.length) return {err:'绕行度上限把所有候选都筛掉了，请放宽绕行度上限'};

  // H1：主枚举被截断时，候选集里可能整条通道都不出现（availChannels 缺失、mustHave 筛成空）。
  // 对「还没出现过、且跳数上允许经过」的通道做一次单通道浅层枚举，把找到的路径并回候选集：
  // 这样候选清单、下拉最低价与筛选结果都与完整候选集一致，且不抬高 ENUM_CAP（只按通道定向补录）。
  if(truncated){
    const covered = new Set();
    for(const p of kept) for(const e of p.edges) covered.add(e.id);
    const dOut = hopDist(adj, from, maxHops, false), dIn = hopDist(adj, to, maxHops, true);
    for(const c of CHpool){
      if(covered.has(c.id) || !channelCouldFit(c, dOut, dIn, maxHops)) continue;
      const part = enumPathsMust(adj, from, to, maxHops, maxDetour==null?PROBE_CAP:PROBE_CAP*8, weightOf, [c.id]);
      for(const p of part){
        if(!keepPath(p)) continue;
        const k = pathKeyOf(p);
        if(!seenPath.has(k)){ seenPath.add(k); kept.push(p); }
      }
    }
  }

  // 「通道组件」候选集：取自绕行度筛选后的**完整候选**，不能用最终 rows。
  // 否则用户选中某组件后其余组件会从选择器里消失、再也点不回来。
  const availChannels = collectChannels(kept);

  // 必经组件筛选：所选通道须全部出现在路径里（不区分行进方向，方向由通道自身 bidir 决定）
  // 旧存档里的组件 id 可能已不存在，先按当前通道表过滤，避免筛出空结果。
  const validIds = new Set(data.CH.map(c=>c.id));
  const mustHave = (input.mustHave||[]).filter(id=>validIds.has(id));
  let picked = mustHave.length
    ? kept.filter(p=>mustHave.every(id=>p.edges.some(e=>e.id===id)))
    : kept;
  // H1：主枚举截断时，候选集只补录了每个通道的少量路径（PROBE_CAP）。用户明确选中组件时改用
  // 「约束枚举」单独求全部经过它的路径（上限同主枚举），使筛选结果与完整枚举一致，不再返回假阴性。
  if(mustHave.length && truncated){
    const seen = new Set(picked.map(pathKeyOf));
    for(const p of enumPathsMust(adj, from, to, maxHops, ENUM_CAP, weightOf, mustHave)){
      if(!keepPath(p)) continue;
      const k = pathKeyOf(p);
      if(!seen.has(k)){ seen.add(k); picked.push(p); }
    }
  }
  if(!picked.length){
    return {err:'没有任何方案同时包含所选的 '+mustHave.length+' 个通道组件，请减少组件',
      availChannels, mustHave, totalAll:kept.length, pendingChannels};
  }

  // 区域共用网络内部走法不同的路径计费完全相同（同区域交流接口不单独收费、不逐段计损），展示上也合并为「X区域网架」：
  // 按「自有通道 + 区域块」签名只保留一条（参考未越限优先，其次物理估算损耗更低、跳数更少），避免同价方案刷屏
  const sigOf = p => { const parts=[]; p.edges.forEach((e,i)=>{
      const ra=env.REGION_OF[p.nodes[i]], rb=env.REGION_OF[p.nodes[i+1]];
      const tok=(e.regional && e.type==='AC' && ra && ra===rb) ? 'R:'+ra : 'E:'+e.id;
      if(tok[0]!=='R' || parts[parts.length-1]!==tok) parts.push(tok);
    }); return parts.join('|'); };
  const rowsAll = picked.map(p=>{
    const r=applyDstQtyLoss(evalPath(p,ctx,env), ctx);
    r.pricingIssues=pricingIssues(r,input,data,date);
    r.priceComplete=r.pricingIssues.length===0;
    r.regionScenarios=['exclude','historical'].map(mode=>{
      const x=ctx.regionLossMode===mode?r:applyDstQtyLoss(evalPath(p,{...ctx,regionLossMode:mode},env), ctx);
      return {mode,border:x.border,landed:x.landed,D:x.D,amount:x.yuan.total,
        regions:x.regionItems.map(v=>({region:v.region,pct:v.pct,status:v.status})),
        complete:false};
    });
    return r;
  });
  // 各通道「经过它的参考未越限方案最低价」按合并前的全部方案统计，区域网架内的联络线也能取到价格
  const channelBest = {};
  for(const r of rowsAll) if(r.feasible) for(const e of r.edges) if(channelBest[e.id]==null || r.landed<channelBest[e.id]) channelBest[e.id]=r.landed;
  const bySig = new Map();
  for(const r of rowsAll){
    const k = sigOf(r), cur = bySig.get(k);
    const better = !cur || (r.feasible!==cur.feasible ? r.feasible
      : Math.abs(r.landed-cur.landed)>1e-9 ? r.landed<cur.landed
      : r.hops!==cur.hops ? r.hops<cur.hops : r.Dphys>cur.Dphys);
    if(better) bySig.set(k, r);
  }
  const rows = [...bySig.values()];
  rows.forEach(r=>{ r.tagLabel = tagOf(r, N); });

  // 三口径各自排名（在任何过滤之前算，保证「与最优差多少」是全局口径）
  const byA=[...rows].sort((a,b)=>a.landed-b.landed);
  const byB=[...rows].sort((a,b)=>a.channelOnly-b.channelOnly);
  // 口径三依赖受端目标交付价；未给出时不排、不评名次
  const byC=hasDst ? [...rows].sort((a,b)=>b.senderNet-a.senderNet) : null;
  rows.forEach(r=>{r.rankA=byA.indexOf(r)+1;r.rankB=byB.indexOf(r)+1;r.rankC=byC?byC.indexOf(r)+1:null;});
  const bestA=byA.find(r=>r.feasible)||byA[0];
  const bestB=byB.find(r=>r.feasible)||byB[0];
  const bestC=byC ? (byC.find(r=>r.feasible)||byC[0]) : null;

  const total = rows.length;
  const feasibleCount = rows.filter(r=>r.feasible).length;
  const cmp = input.sortBy==='B' ? (a,b)=>a.channelOnly-b.channelOnly
    : input.sortBy==='C' && hasDst ? (a,b)=>b.senderNet-a.senderNet
    : (a,b)=>a.landed-b.landed;
  // 同价时按跳数、节点序列定序，结果与枚举顺序无关
  const tie = (a,b)=> cmp(a,b) || a.hops-b.hops || (a.nodes.join('>')<b.nodes.join('>')?-1:a.nodes.join('>')>b.nodes.join('>')?1:0);
  rows.sort((a,b)=> a.feasible===b.feasible ? tie(a,b) : (a.feasible?-1:1));

  let shown = rows;
  if(!input.showBad) shown = rows.filter(r=>r.feasible);
  if(!shown.length){
    // 仍带回通道清单与筛选条件：界面据此保留通道选择器，用户可取消筛选或改看越限方案，不会被困在错误态
    return {err:'全部 '+total+' 条候选路线均超出通道容量或断面限额',
      allInfeasible:true, availChannels, mustHave, totalAll:kept.length, pendingChannels};
  }
  return {rows:shown,byA,byB,byC,bestA,bestB,bestC,n:shown.length,total,feasibleCount,truncated,
    availChannels,mustHave,totalAll:kept.length,pendingChannels,channelBest};
}

/** 路径唯一键：节点序列 + 边序列。不能用边对象的 from/to（反向通行的联络线存储方向与行进方向相反）。 */
function pathKeyOf(p){ return p.nodes.join('>')+'#'+p.edges.map(e=>e.id).join(','); }

/** 受端电价已含上网环节线损费用时的终端电量折算（M10）。
 *  这类主体（深圳：1077号附件1 第22页注2「各电价含…上网环节线损费用」）线损率只用于把省间节点交付电量
 *  折算成终端用电量，不单列「受端上网环节线损费用」一项。
 *  ⚠ 折算只改金额基数，不改实付总额：qty 是买方在省间节点的交付电量，省界及以前的每一项都按 qty 实付，
 *  折量后金额不得跟着缩水（曾经整体等比缩放，1000 MWh / 2.11% 少计了 2.11% 的上游成本）。
 *  因此：上游项金额不动、单价改按到户电量表述（÷k）；受端项单价本就按到户电量计、金额改按到户电量（×k）。
 *  结果满足 Σ单价 = landed、Σ金额 = 实付总额，landed = 省界价/(1−ρ) + 受端各项。
 *  缺省（不传 dstQtyLossPct）时不进入本函数，旧口径完全不变。 */
const UPSTREAM_COMPS=['gen','loss','send','trans','reg','originLoss'];   // 省界及以前，按节点交付电量实付
const DST_COMPS=['inLoss','net','fund','cap','sysOp'];                   // 受端省内，单价按到户电量计
function applyDstQtyLoss(r, ctx){
  if(ctx.dstQtyLossPct==null || ctx.includeDstCost===false) return r;
  const consumerQty=ctx.qty*(1-ctx.dstQtyLossPct/100);
  if(!(r.amountQty>0) || !(consumerQty>0)) return r;
  const k=consumerQty/r.amountQty;
  for(const key of UPSTREAM_COMPS) r.comp[key]/=k;      // 金额不变 ⇒ 单价 = 金额/到户电量
  for(const key of DST_COMPS) r.yuan[key]*=k;           // 单价不变 ⇒ 金额 = 单价×到户电量
  r.yuan.total=UPSTREAM_COMPS.concat(DST_COMPS).reduce((a,key)=>a+r.yuan[key],0);
  r.consumerQty=consumerQty; r.amountQty=consumerQty;
  r.landed=r.yuan.total/consumerQty;
  r.qtyLossPct=ctx.dstQtyLossPct;                       // 界面据此说明「电价已含线损、不单列线损费用行」
  return r;
}

/** 从 start 出发（reverse=true 时沿反向图）不超过 maxHops 跳可达的省 → 最小跳数。
 *  仅用于通道探测的廉价剪枝：最小跳数和已超过 maxHops 的通道不必再跑枚举。 */
function hopDist(adj, start, maxHops, reverse){
  const g={};
  if(reverse){ for(const u in adj) for(const nb of adj[u]) (g[nb.to]||(g[nb.to]=[])).push(u); }
  else for(const u in adj) g[u]=adj[u].map(nb=>nb.to);
  const d={}, q=[start];
  d[start]=0;
  for(let i=0;i<q.length;i++){
    const u=q[i];
    if(d[u]>=maxHops) continue;
    for(const v of g[u]||[]) if(d[v]==null){ d[v]=d[u]+1; q.push(v); }
  }
  return d;
}

/** 通道 c 在跳数上是否可能出现在某条 src→dst 路径里（必要非充分：两段最短路的节点可能重叠）。
 *  只用于过滤明显不可能经过的通道，避免为它们做无谓的枚举。 */
function channelCouldFit(c, dOut, dIn, maxHops){
  const dirs = c.bidir ? [[c.from,c.to],[c.to,c.from]] : [[c.from,c.to]];
  return dirs.some(([u,v])=> dOut[u]!=null && dIn[v]!=null && dOut[u]+1+dIn[v]<=maxHops);
}

/** 带「必经通道」约束的路径枚举：规则与 enumPaths 一致（简单路径、跳数上限、originOnly 仅首段），
 *  额外要求路径覆盖 requiredIds 中每一条通道（不区分行进方向，方向由 bidir 决定）。
 *  与 enumPaths 解耦，使通道筛选不受主枚举截断影响（H1）。 */
function enumPathsMust(adj, src, dst, maxHops, cap, weightOf, requiredIds){
  const need=new Set(requiredIds), got=new Set();
  const out=[], nodes=[src], edges=[], visited=new Set([src]);
  let hitCap=false;
  const ord={};
  for(const k in adj) ord[k]=adj[k].slice().sort((a,b)=>weightOf(a,k)-weightOf(b,k));
  (function dfs(u){
    if(hitCap) return;
    if(u===dst){
      if(got.size!==need.size) return;
      if(out.length===cap){ hitCap=true; return; }
      out.push({nodes:nodes.slice(),edges:edges.slice()});
      return;
    }
    if(edges.length>=maxHops) return;
    for(const nb of ord[u]||[]){
      if(visited.has(nb.to)) continue;
      if(nb.e.originOnly && u!==src) continue;
      const add = need.has(nb.e.id) && !got.has(nb.e.id);
      if(add) got.add(nb.e.id);
      visited.add(nb.to); nodes.push(nb.to); edges.push(nb.e);
      dfs(nb.to);
      edges.pop(); nodes.pop(); visited.delete(nb.to);
      if(add) got.delete(nb.e.id);
      if(hitCap) return;
    }
  })(src);
  out.hitCap=hitCap;
  return out;
}

/** 「通道组件」选择器的候选清单：候选路径里出现过的通道，每条只列一项。
 *  直流（专项工程）排在前，同类按出现次数降序 —— 出现得多说明它是绕不开的主干通道。
 *  dirs 记录该通道在候选里出现过的行进方向，供界面提示「仅单向」还是「两方向都有」。
 *  直流可直接作为组件挑选（用户要求的用法），交流联络线同样可挑，语义一致。 */
function collectChannels(paths){
  const byId = new Map();
  for(const p of paths){
    for(let i=0;i<p.edges.length;i++){
      const e = p.edges[i];
      let rec = byId.get(e.id);
      if(!rec){
        rec = { id:e.id, n:e.n, type:e.type, kv:e.kv, from:e.from, to:e.to,
                tier:e.tier, bidir:!!e.bidir, count:0, dirs:[] };
        byId.set(e.id, rec);
      }
      rec.count++;
      const d = p.nodes[i]+'>'+p.nodes[i+1];
      if(rec.dirs.indexOf(d) < 0) rec.dirs.push(d);
    }
  }
  const rank = (t)=> t==='DC' ? 0 : (t==='AC/DC' ? 1 : 2);
  return [...byId.values()].sort((a,b)=>
    rank(a.type)!==rank(b.type) ? rank(a.type)-rank(b.type) : b.count-a.count);
}

/** 方案的短标签：单段用线路名，多段用途经省。 */
function tagOf(r, N){
  const mid=r.nodes.slice(1,-1);
  r.leadLine=r.edges[0].n;
  r.via = mid.length ? '经'+mid.map(N).join('、') : '';
  return r.leadLine;
}

/** 缺少适用证据不等于费用为零。issues 随页面和导出报告保留。 */
function pricingIssues(r,input,data,date){
  const issues=[];
  issues.push('区域收费范围按所选路径/公告假设归集，实际收费单元和送受端计量点须核对本笔中长期交易方案。');
  if(input.sourceQuote==='export') issues.push('假设送出关口报价已含送出省输电费与省内网损，不重复加收。');
  else if(input.originLossMode!=='separate') issues.push('假设送端报价已覆盖省内网损；未覆盖时需选择另计。');
  else if(r.exportLossPct==null) issues.push('送端省内网损率缺项，另计金额未完整计入。');
  const first=r.edges[0];
  const rawSend=first.regional?tariffOf(first,r.nodes[0]):first.bidir&&r.nodes[0]===first.to?first.sendFeeRev:first.sendFee;
  if(input.sourceQuote!=='export' && rawSend==null) issues.push('起点送出省输电价格缺项，当前费用小计未完整计入。');
  if(r.regionLossMissing.length) issues.push('区域网损尚未计入：'+r.regionLossMissing.join('、')+'；当前结果为缺项测算。');
  if(r.regionItems.some(v=>v.status==='historical')) issues.push('区域网损采用第三监管周期参考值；第四周期继续适用性未核实。');
  if(r.regionItems.some(v=>v.status==='custom')) issues.push('区域网损为用户输入假设，须核对备案文件、适用期及交易品种。');
  if(input.includeRegion===false) issues.push('区域输电费已关闭，仅为对比情景；须确认交易方案是否豁免或已含区域费用。');
  if(input.lossBearer!==1) issues.push('网损分担为自定义合同模拟，实际需按中长期合同与交易方案执行。');
  if(r.nodes.some(k=>data.REGION_OF[k]==='南方')) issues.push('涉及南方电网：需另核南方区域及跨经营区规则，本规则不能直接覆盖；区域费缺项不代表免费。');
  for(const code of [...new Set([r.nodes[0],r.nodes.at(-1)])]) if(data.PV[code].scopeNote) issues.push(data.PV[code].scopeNote);
  if(r.nodes.slice(1,-1).some(k=>k==='NM'||k==='HE')) issues.push('过境节点存在多个电网主体，省级连通不保证主体间可连续转送。');
  if(r.regTransit) issues.push('过境区域按共用网络最后出口归集为测算假设；具体交易路径收费范围须核对交易机构发布方案。');
  if(r.nodes.every(k=>['BJ','TJ','HE'].includes(k))) issues.push('京津唐内部交易可能免华北电量电费；需明确电厂所在电网，当前按未豁免情景计算。');
  if(r.edges.some(e=>e.tariffStatus==='unknown')) issues.push('背靠背接口独立输电价尚未核实，未计独立费用；不得据此判定免费。');
  if(r.edges.some(e=>e.lossStatus==='estimate' && e.type!=='AC')) issues.push('背靠背接口线损为估算参数，缺少核定或备案依据。');
  if(r.edges.some(e=>!e.regional && (e.t==null || e.loss==null))) issues.push('专项工程价格或线损存在缺项，当前小计不完整。');
  if(r.edges.some(e=>e.sourceIssue || !e.eff)) issues.push('部分专项工程来源版本或生效日期未核实，详见逐段溯源。');
  if(r.edges.some(e=>/电厂|白鹤滩/.test(e.fn+' '+e.note))) issues.push('点对网或配套电源工程可能有专属电源/送出费用，不可直接视为全省通用交易接口。');
  if(r.edges.some(e=>e.priceType==='capacity')) issues.push('容量制工程使用边际费用情景；输电权取得与实际报价、容量费用分摊需另核。');
  if(input.srcSendFee!=null && input.sourceQuote!=='export') issues.push('采用送端电站专属送出价'+(input.srcSendNote?'（'+input.srcSendNote+'）':'')+'，须确认本笔电量在核定电站范围与年度额度内。');
  if(input.includeDstCost!==false){
    const inLoss=input.dstInLossPct ?? data.PV[input.to].inLoss;
    if(data.PV[input.to].fund==null) issues.push('受端基金及附加核定标准待补；手填值仅为测算输入。');
    if(inLoss==null) issues.push('受端上网环节线损未获取，当前未计此项。');
    if(input.dstQtyLossPct!=null) issues.push('受端电网主体电价已含上网环节线损费用：终端电量按 '+input.dstQtyLossPct+'% 折算，不单列线损费用行；省界及以前各项金额仍按节点交付电量实付（1077号附件1 注2、注3）。');
    if(input.dstBilling==='twopart' && !(input.dstCapFee>0)) issues.push('受端按两部制计价，未含容量/需量电费，到户价偏低。');
    if(input.dstCapFee>0) issues.push('容量/需量电费按用户负荷假设分摊为度电费用，属估算，实际按月度账单计收。');
    if(input.dstSysOpFee==null) issues.push('系统运行费未计入（按月变化，可手填）。');
    issues.push('到户结果仅为已列费用小计；政府性基金按工商业用户口径取值，地方分摊、峰谷分时、力调电费及特殊用户减免未计。');
    if(inLoss!=null && inLoss>0) issues.push('受端线损以本路径省界价作购损电价假设；实际月度购损价格可能不同。');
  }
  return [...new Set(issues)];
}

/* ===== src/app/ui/theme.js ===== */
/* 主题工具：读取设计令牌（src/tokens.css）当前生效的实际值；外观主题的应用、切换与外观面板（文件后半）。
   界面样式与模板字符串一律直接写 var(--x)，主题切换时浏览器自动重算，不需要本文件。
   只有「不认 CSS 变量、必须拿到真实颜色字符串」的地方才用这里：
     腾讯地图 / 天地图的样式对象、data: URI 里的 SVG、canvas 绘制、脱离页面的 SVG 快照。
   这些调用都发生在绘制时（不在脚本求值时预先算好），切换主题后重绘即可跟随。
   只属于界面层：算法层 src/app/algo/* 不得引用（tools/test-modules.mjs 纯度守卫）。 */

/** tokenColor('--map-route') → '#185FA5'（按 <html> 上当前生效的主题取值）。
    也接受 'var(--x)' 形式。取不到（无 DOM 的测试环境、令牌未定义）时返回 fallback（缺省为空串）。 */
function tokenColor(name,fallback){
  const raw=String(name==null?'':name).trim();
  const m=/^var\(\s*(--[\w-]+)\s*\)$/.exec(raw);
  const key=m?m[1]:raw;
  try{
    if(key.startsWith('--')&&typeof getComputedStyle==='function'&&typeof document!=='undefined'&&document.documentElement){
      const v=getComputedStyle(document.documentElement).getPropertyValue(key).trim();
      if(v) return v;
    }
  }catch(e){ /* 取值失败按缺省处理 */ }
  return fallback!=null?fallback:'';
}

/** 让一段 SVG 脱离页面后仍能解析 var()：把它引用到的令牌以当前实际值写到根元素的 style 上
    （自定义属性会被子元素继承）。用于拓扑图快照导出——序列化成独立图片后页面样式表不再生效。
    直接修改传入的元素，调用方应传克隆体。 */
function inlineTokenVars(svgEl){
  const names=new Set();
  const collect=el=>{
    const st=el.getAttribute&&el.getAttribute('style');
    if(st) for(const m of st.matchAll(/var\(\s*(--[\w-]+)/g)) names.add(m[1]);
    for(const c of el.children||[]) collect(c);
  };
  collect(svgEl);
  names.forEach(n=>{ const v=tokenColor(n); if(v) svgEl.style.setProperty(n,v); });
  return svgEl;
}

/* ================= 外观主题：风格 × 明暗 → <html data-theme> ================= */
/* 三套主题：clear（清晰浅色，默认）/ clear-dark（清晰深色）/ tech（科技·调度大屏，固定深色）。
   偏好存本机 LS_UI：{style:'clear'|'tech', mode:'system'|'light'|'dark'}。
   首帧的 data-theme 由 src/template.html <head> 内联脚本按同一规则先行设定（防闪白），这里负责启动后的同步与切换。 */
const UI_STYLES=[['clear','清晰'],['tech','科技']];
const UI_MODES=[['system','跟随系统'],['light','浅色'],['dark','深色']];
let uiPrefs=null;

/** 读取外观偏好；存储不可用或内容非法时回退默认（清晰 · 跟随系统） */
function loadUiPrefs(){
  const p={style:'clear',mode:'system'};
  try{
    const o=JSON.parse(localStorage.getItem(LS_UI)||'null');
    if(o&&typeof o==='object'){
      if(UI_STYLES.some(s=>s[0]===o.style)) p.style=o.style;
      if(UI_MODES.some(m=>m[0]===o.mode)) p.mode=o.mode;
    }
  }catch(e){ /* 存储不可用：静默用默认 */ }
  return p;
}
function systemPrefersDark(){
  try{ return !!(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; }
}
/** 偏好 → 主题 id（与 <head> 内联脚本同一规则：科技固定深色；清晰按明暗，跟随系统时看 prefers-color-scheme） */
function resolveTheme(p){
  if(p.style==='tech') return 'tech';
  return (p.mode==='dark'||(p.mode==='system'&&systemPrefersDark()))?'clear-dark':'clear';
}

/** 应用主题：设 data-theme → 同步浏览器 / 安卓壳的系统栏颜色 → 网架图页在场时重绘（地图 SDK 样式、
    data: URI 圆点、快照都在绘制时读令牌）→ 外观面板打开时刷新选中态。传入 prefs 时先保存到本机。 */
function applyTheme(prefs){
  if(prefs){ uiPrefs=prefs; try{ localStorage.setItem(LS_UI,JSON.stringify(prefs)); }catch(e){} }
  if(!uiPrefs) uiPrefs=loadUiPrefs();
  const th=resolveTheme(uiPrefs);
  const de=typeof document!=='undefined'&&document.documentElement;
  if(!de||!de.setAttribute) return th;   // 无 DOM 的测试环境
  const changed=de.getAttribute('data-theme')!==th;
  de.setAttribute('data-theme',th);
  syncSystemBars();
  if(changed){
    const mv=document.getElementById('v-map');
    if(mv&&!mv.hidden&&typeof renderMap==='function') renderMap();
  }
  renderAppearance();
  return th;
}
/** 系统明暗变化：只在「跟随系统」时跟随 */
function watchSystemTheme(){
  try{
    if(typeof window==='undefined'||!window.matchMedia) return;
    const mq=window.matchMedia('(prefers-color-scheme: dark)');
    const h=()=>{ if(uiPrefs&&uiPrefs.mode==='system') applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change',h); else if(mq.addListener) mq.addListener(h);
  }catch(e){ /* 老内核不支持：保持启动时的主题 */ }
}

/** 系统栏颜色 = 当前主题的 --system-bar（页头色的不透明版，#RRGGBB）。
    <meta name="theme-color">：浏览器地址栏 / PWA 状态栏；window.IPRouteShell：安卓壳的桥（Web / iOS 没有，忽略）。 */
function syncSystemBars(){
  const hex=String(tokenColor('--system-bar')).trim().toUpperCase();
  if(!/^#[0-9A-F]{6}$/.test(hex)) return;
  try{
    const meta=typeof document.querySelector==='function'&&document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content',hex);
  }catch(e){}
  // 深底配浅色图标：按相对亮度判断（与 WCAG 同一公式）
  const ch=[1,3,5].map(i=>{ const v=parseInt(hex.slice(i,i+2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  const lightIcons=(0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2])<0.4;
  try{
    const sh=typeof window!=='undefined'&&window.IPRouteShell;
    if(sh&&typeof sh.setSystemBars==='function') sh.setSystemBars(hex,lightIcons);
  }catch(e){ /* 壳侧异常不影响页面 */ }
}

/* ---------- 外观面板（复用参数弹层 .sheet 结构；手机从底部滑出，≥600px 从右侧滑出） ---------- */
let _appearanceOpen=false;
function renderAppearance(){
  const body=typeof document!=='undefined'&&document.getElementById&&document.getElementById('theme-body');
  if(!body||!uiPrefs) return;
  const tech=uiPrefs.style==='tech';
  const seg=(key,list,cur,dis)=>`<div class="seg" role="radiogroup" aria-label="${key==='style'?'风格':'明暗'}">${list.map(([v,t])=>
    `<button type="button" role="radio" aria-checked="${cur===v}" class="${cur===v?'on':''}"${dis?' disabled':''} data-ui-${key}="${v}" onclick="setUiPref('${key}','${v}')">${t}</button>`).join('')}</div>`;
  body.innerHTML=`<div class="psub">风格</div>${seg('style',UI_STYLES,uiPrefs.style,false)}
    <div class="psub">明暗</div>${seg('mode',UI_MODES,uiPrefs.mode,tech)}

/* 测算页：参数输入、可选路线列表、方案详情。
   依赖：config / format / data / state / algo/*。 */
/* ================= 测算页 ================= */
/* 重渲染稳定性（spec: ui-render-stability）：折叠面板展开态快照/恢复。
   全部面板按文档序快照；重建后数量一致且 id 位序相同才逐位还原
   （条件渲染会改变面板集合，错位恢复比收起更糟），否则仅有稳定 id 的面板按 id 恢复。
   ⚠ DOM 无 id 元素的 .id 是空串不是 null，比较两侧都要归一化。
   id 面板的展开态另存跨渲染 memo：穿过「该面板不存在的中间帧」（如错误态）再回来也不丢。 */
const _detailMemo={};
function snapDetails(root){
  if(!root || !root.querySelectorAll) return [];   // VM 测试桩无此方法（与旧 _capOpen 守卫同风格）
  const snap=[...root.querySelectorAll('details')].map(d=>({id:d.id||null,open:d.open}));
  snap.forEach(s=>{ if(s.id) _detailMemo[s.id]=s.open; });
  return snap;
}
function restoreDetails(root,snap){
  if(!root || !root.querySelectorAll) return;
  const now=[...root.querySelectorAll('details')];
  if(snap.length===now.length && snap.every((s,i)=>(now[i].id||null)===(s.id||null))){
    now.forEach((d,i)=>{ d.open=snap[i].open; });
    return;
  }
  now.forEach(d=>{ if(d.id && _detailMemo[d.id]!==undefined) d.open=_detailMemo[d.id]; });
}
function renderCalc(){
  const res=state._res;
  // M11：存档里的 sel 可能越界（方案数随参数变化），渲染前统一夹取到合法范围，
  // 否则标题会写「方案 #N」而列表高亮在另一条（其余位置此前各自 clamp，口径不一）。
  if(res&&res.rows&&res.rows.length&&(state.sel<0||state.sel>=res.rows.length)) state.sel=0;
  // 重渲染会整体替换 v-calc：先记录其中的焦点控件与光标位置，重建后恢复，
  // 否则连续步进或输入到一半就会被打断。
  const _host=document.getElementById('v-calc');
  const _ae=(typeof document.activeElement!=='undefined')?document.activeElement:null;
  // 参数面板正文同样会被重画，焦点在面板里时也要恢复
  const _sheet=document.getElementById('param-sheet');
  const _inside=el=>!!(el&&el.contains&&el.contains(_ae));
  const _fid=(_ae&&_ae.id&&(_inside(_host)||_inside(_sheet)))?_ae.id:null;
  // 重渲染稳定性：快照全部折叠面板展开态（含容量电费卡 d-capfee），重建后统一恢复
  const _detailSnap=_host?snapDetails(_host):[];
  let _caret=null;
  if(_fid){ try{ _caret=[_ae.selectionStart,_ae.selectionEnd]; }catch(e){ /* number 型输入无 selection */ } }
  const opt=(sel,ex)=>Object.keys(PV).map(k=>
    `<option value="${k}" ${k===sel?'selected':''} ${k===ex?'disabled':''}>${PV[k].n}</option>`).join('');
  // 只算到受端省界：受端省内两项（省网输配电价 / 基金及附加）不参与计算，界面上置灰并标注
  const noDst=state.includeDstCost===false;

  // 存储故障可见化（spec: local-persistence）：写入失败后常驻提示，测算功能不受影响
  const _sbHead=_storageBroken?`<div class="warn">⚠ 本机存储不可用（隐私模式或空间已满），本次的参数与费率修改在重开应用后不会保留。</div>`:'';
  let out=_sbHead+`<div class="hero">
    <div class="hero-top">
      <div class="picker">
        <div class="pk-col">

      </div>
    </div>
    <div class="hero-main">
      <label class="hero-price"><span>送端报价 元/MWh（含税）</span><input id="i-pgen" type="number" inputmode="decimal" value="${state.pGen}" step="5"></label>
      ${renderHeroResult(res)}
    </div>
    ${renderParamBar()}
    ${renderPriceComposition(res)}
  </div>

`;

  const _toPV=PV[state.to];
  if(!noDst && _toPV && (_toPV.fund===null || _toPV.fund===undefined)){
    out+=`<div class="warn">受端省「${esc(_toPV.n)}」的政府性基金及附加暂未获取官方标准，本次测算按 0 计，落地成本会被低估。</div>`;
  }

  if(res&&res.err){
    // 通道筛空或候选全部越限时，顶部通道选择器仍在；错误卡再给出可直接点的退路，避免困在错误态
    const _chanOn=(res.mustHave||[]).length>0;
    const _acts=(_chanOn?'<button class="btn ghost" type="button" onclick="clearChannel()">取消通道筛选</button>':'')
      +(res.allInfeasible?'<button class="btn ghost" type="button" onclick="state.showBad=true;state.sel=0;doSolve()">显示越限方案</button>':'');
    out+=`<div class="card"><div class="empty">${esc(res.err)}${_acts?`<div class="empty-acts">${_acts}</div>`:''}</div></div>`;
  } else if(res&&res.rows&&res.rows.length){
    // 左＝路线列表，中＝方案详情，右＝智能推荐（宽屏，AI_ENABLED 关闭时不渲染）；手机端纵向堆叠，布局由 .layout 的 CSS 决定
    out+='<div class="layout'+(AI_ENABLED?'':' no-ai')+'"><div class="col-side">'+renderRouteList(res)+'</div>'
       + (AI_ENABLED?'<div class="col-ai">'+renderAI(res)+'</div>':'')
       + '<div class="col-main">'+renderDetail(res,selectedRow(res))+renderSensitivity(res)+'</div></div>';
  } else {
    out+=`<div class="card"><div class="empty">请选择不同的出发地与目的地</div></div>`;
  }
  // REQ-401 容量电费测算器：独立折叠卡，不参与路径比选（发改价格〔2020〕1441号 / 〔2023〕532号口径），放在方案之后
  out+=renderCapFee();
  // 政策口径与取值依据放在整页最下方
  out+=`<div class="policy-foot">
    <details class="explain"><summary>政策与取值依据</summary><div class="inner">
    <p class="note"><b>测算范围</b>：省间中长期单时段交付成本。默认交付点为受端省间交易节点；送端报价按手填合同或拟报价测算。候选路线取 ${MAX_HOPS} 段以内、不限绕行的全部路径，按价格从低到高排序。合同分时曲线、交易组织、安全校核、执行偏差与实际结算需另行处理。</p>
    <p class="note"><b>参数含义</b>：送端报价边界「不含省内输电费」指电能量报价，送出省输电费另计；「含省内费用」指送出关口报价，已含送出省输电费与省内网损，二者均不再追加。送端省内网损默认「另计」：按 1077号附件1 各省表注4 的送省外上网环节线损率估算（该注明确送出价「含税、不含线损」、线损率单列），长三角跨省中长期实施细则（2026）第三十六条亦规定落地侧价格含「送出省外送输电价格（含送出省外送输电网损）」；报价若已自行覆盖该损耗，选「不另计」。费用边界「省间交易节点」不含受端省网输配电价与政府性基金及附加；「到户已列费用」另计这两项与省内线损估算。中长期占用 % 用于容量校验时扣减参考容量。通道范围「仅专项工程」排除当期可交易性未确认的联络线。</p>
    <p class="note"><b>区域电网输电价格</b>采用发改价格〔2026〕1077号附件2公开的电量电价，含税、不含线损；区域容量电价已通过省级输配电价回收。区域费范围「途经区域各计一次」按交易路径中的共用网络归集；直接落地的专项工程是否另计受端区域，应以本笔中长期交易公告为准，公告要求时选「另计受端区域」。京津唐豁免须核对具体电网主体。</p>
    <p class="note"><b>区域网损</b>：默认「第三周期参考值」——长三角跨省中长期实施细则（2026）第三十六条规定落地侧价格含华东跨省输电网损，上网价格 =（落地侧成交价 − 华东跨省输电价格）×（1 − 华东跨省输电网损率）− 送出省外送输电价格。参考值为 ${Object.entries(DATA.RLOSS||{}).map(([k,v])=>esc(k)+' '+v.historicalPct+'%').join('、')}，来自国网第三监管周期历史公开表（转载来源），尚未确认适用于第四监管周期；「不计入」为缺项基准，不代表已核定为 0；「手填」为待核实假设。区域共用交流接口不再逐段计损。</p>
    <p class="note"><b>费用去重</b>：起点送出省费只计一次；报价已含则不再加。过境交流接口不单独收费，也不按每条抽象接口重复计损；独立专项工程按自身输电价与损耗口径。已含损耗的核价项目不再追加计费损耗。</p>
    <p class="note"><b>网损与合同约定</b>：默认买方承担跨省计费网损，可模拟双方分担。送端省内网损由报价边界选择是否另计，另计时以送端报价估算购损成本；实际合同、交易方案优先。现货规则中的卖方承担约定不自动套用于中长期。</p>

    <div class="lib-src" style="margin-top:6px">当前取值依据：受端 <b>${esc(PV[state.to]?PV[state.to].n:'—')}</b>　输配电价 ${fmt(state.pNet)} 元/MWh　基金及附加 ${state.fundMissing?'<span style="color:var(--red)">未获取</span>':fmt(state.fund)+' 元/MWh'}${noDst?'　<span style="color:var(--ink3)">（当前口径不计入以上两项）</span>':''}<br>${esc(PV[state.to]?PV[state.to].netSrc:'—')}</div>
    </div></details>

/* ---------- 参数弹出面板 ----------

let _sheetOpen=false;
function renderParamBody(noDst){

/* ---------- 受端到户：电网主体 × 电压档别 × 单一制/两部制（DATA.VT，1077号附件1） ----------
   输配电价由所选档别带入 pNet（仍可手改、「恢复」回到所选档核定值）；注3 线损率随电网主体；
   电价已含线损的主体（如深圳）受端线损按 0。基金按工商业用户口径，不随电压等级变化。 */
function dstEntities(){ const v=(DATA.VT||{})[state.to]; return v&&Array.isArray(v.主体)?v.主体:[]; }
function dstEntity(){
  const list=dstEntities(), def=((DATA.VT||{})[state.to]||{}).默认主体;
  return list.find(e=>e.id===state.dstEntity)||list.find(e=>e.id===def)||list[0]||null;
}
function dstTiers(ent){ return ent&&Array.isArray(ent.档位)?ent.档位.filter(t=>t.单一制!=null||t.两部制!=null):[]; }
function dstTariff(){
  const ent=dstEntity(), tiers=dstTiers(ent);
  const tier=tiers.find(t=>t.档别===state.dstTier)||tiers[tiers.length-1]||null;   // 缺省取最高电压档
  let billing=state.dstBilling==='single'?'single':'twopart';
  if(tier && tier[billing==='single'?'单一制':'两部制']==null) billing=billing==='single'?'twopart':'single';
  const net=tier?tier[billing==='single'?'单一制':'两部制']:null;
  const inLoss=ent?(ent.电价含线损?0:ent.省内上网环节线损率):null;
  // M10：电价已含线损（深圳）时线损率只折算终端电量、不另计线损费用；未含线损时由 dstInLossPct 承担两项语义
  const qtyLossPct=ent&&ent.电价含线损?ent.省内上网环节线损率:null;
  // M9：结构特殊（深圳按用户容量类别 × 月度负荷率分档、无标准电压档）时不自动取值，避免静默沿用其它主体电价
  const special=!!(ent&&ent.结构特殊&&!tiers.length);
  return {ent,tier,billing,net:net??null,inLoss:inLoss??null,qtyLossPct,special};
}
/* 当前受端主体 / 电压档应自动带入的输配电价；结构特殊（深圳）返回 null = 缺项，须手填。 */
function dstAutoNet(){
  const vt=dstTariff();
  if(vt.special) return null;
  if(vt.net!=null) return vt.net;
  const t=PV[state.to];
  return (t&&t.net!=null)?t.net:null;
}
/* 受端省基金及附加的核定值；官方未获取（西藏）时为 null，界面按缺项处理，不静默按 0。 */
function dstAutoFund(){ const t=PV[state.to]; return (t&&t.fund!=null)?t.fund:null; }
/* 两部制容（需）量电费按用户负荷假设折成度电：月单价 × 12 ÷（8760 h × 负荷率）→ 元/MWh。负荷率未填则不计。 */
function dstCapFee(vt){
  if(!vt||!vt.tier||vt.billing!=='twopart'||!state.dstCapMode||state.dstCapMode==='none') return 0;
  const lf=+state.dstLoadFactor, price=state.dstCapMode==='capacity'?vt.tier.容量电价:vt.tier.需量电价;
  if(!(lf>0&&lf<=100)||price==null) return 0;
  return price*12/(8.76*lf/100);
}
// 原文未给数值的条目（如蒙西送华北「按现行模式执行」）不提供选择
function srcStations(){ const v=(DATA.SRCX||{})[state.from]; return Array.isArray(v)?v.filter(x=>x.送出价!=null):[]; }
function srcStation(){ const k=state.srcStation; return k!=null&&k!==''?srcStations()[+k]||null:null; }
/* 交给 solve() 的完整输入：state + 由界面选择派生的可选字段（不写回 state、不持久化） */
function solveInput(){
  const extra={};
  if(state.includeDstCost!==false){
    const vt=dstTariff();
    if(vt.ent){
      extra.dstInLossPct=vt.inLoss;
      // M10：电价已含线损的主体（深圳）把「终端电量折算」与「是否另计费」拆开：
      // dstInLossPct=0（不另计费）+ dstQtyLossPct=注3 线损率（扣电量）
      if(vt.qtyLossPct!=null) extra.dstQtyLossPct=vt.qtyLossPct;
    }
    if(vt.tier){ extra.dstBilling=vt.billing; }
    extra.dstCapFee=dstCapFee(vt);
    extra.dstSysOpFee=state.dstSysOpFee??null;
  }
  const st=srcStation();
  if(st && state.sourceQuote!=='export'){ extra.srcSendFee=st.送出价; extra.srcExportLossPct=st.线损率??null; extra.srcSendNote=st.范围; }
  return Object.assign({},state,extra);
}
/* 主卡口径摘要：费用边界与报价边界恒显示，其余只列与默认值不同的项（标色并计入角标） */
function paramSummary(){
  const t=PV[state.to], items=[
    ['费用边界',state.includeDstCost?'到户已列费用':'省间交易节点',state.includeDstCost!==PARAM_DEFAULTS.includeDstCost],
    ['报价边界',state.sourceQuote==='export'?'含省内费用':'不含省内输电费',state.sourceQuote!==PARAM_DEFAULTS.sourceQuote],
  ];
  if(state.includeDstCost){
    const vt=dstTariff(), def=((DATA.VT||{})[state.to]||{}).默认主体;
    if(vt.tier){
      const tiers=dstTiers(vt.ent), chg=(vt.ent&&vt.ent.id!==def)||vt.tier!==tiers[tiers.length-1]||vt.billing!=='twopart';
      items.push(['到户',(vt.ent&&vt.ent.id!==def?vt.ent.名称+' ':'')+vt.tier.档别+' '+(vt.billing==='single'?'单一制':'两部制'),chg]);
    }
    const base=vt.net??(t&&t.net);
    if(base!=null && state.pNet!==base) items.push(['受端输配电价',fmt(state.pNet,2),true]);
    const cap=dstCapFee(vt);
    if(cap>0) items.push(['容（需）量电费',fmt(cap,1)+' 元/MWh',true]);
    if(state.dstSysOpFee!=null) items.push(['系统运行费',fmt(state.dstSysOpFee,1)+' 元/MWh',true]);
  }
  if(srcStation() && state.sourceQuote!=='export') items.push(['送出价',srcStation().范围,true]);
  if(state.includeDstCost && t && state.fund!==(t.fund??0)) items.push(['基金及附加',fmt(state.fund,2),true]);
  if(state.sourceQuote!=='export' && state.originLossMode!==PARAM_DEFAULTS.originLossMode) items.push(['送端省内网损',state.originLossMode==='separate'?'另计':'不另计',true]);
  if(!state.includeRegion) items.push(['区域电网费','不计入',true]);
  else{
    if(state.regionChargeMode==='buyer') items.push(['区域费范围','另计受端区域',true]);
    if(state.regionLossMode!==PARAM_DEFAULTS.regionLossMode) items.push(['区域网损',{exclude:'不计入',historical:'第三周期参考值',custom:'手填'}[state.regionLossMode]||state.regionLossMode,true]);
  }
  if(+state.lossBearer!==PARAM_DEFAULTS.lossBearer) items.push(['网损承担',state.lossBearer==0.5?'两端各半':'送端承担',true]);
  if(state.tradableOnly) items.push(['通道范围','仅专项工程',true]);
  if(state.occPct>0) items.push(['中长期占用',state.occPct+'%',true]);
  return items;
}

/* 到户口径下的醒目缺项提示：两部制未计容（需）量电费会明显低估到户价；

function renderDstWarn(){

    return `<div class="cfg-warn">⚠ ${esc(vt.ent.名称)}输配电价按用户容量类别与月度负荷率分档（1077号附件1 第 ${esc(vt.ent.页码)} 页），本工具不能自动带入（不沿用其它主体值）：${state.pNet==null?'<b>请手填受端输配电价</b>':'当前为手填值，请核对适用档'}　<a onclick="openParams()">去填写</a></div>`;

function openParams(){
  const el=document.getElementById('param-sheet');
  if(!el || _sheetOpen) return;
  _sheetOpen=true;
  el.classList.add('open'); el.setAttribute('aria-hidden','false');
  document.body.classList.add('sheet-open');
  // 压一条历史记录：安卓返回键 / 浏览器后退时先关闭面板（安卓壳 onBackPressed 在可后退时后退）
  try{ history.pushState({paramSheet:1},''); }catch(e){}
  const x=document.getElementById('sheet-close');
  if(x&&x.focus){ try{ x.focus({preventScroll:true}); }catch(e){} }
}
function closeParams(fromHistory){
  if(!_sheetOpen) return;
  _sheetOpen=false;
  const el=document.getElementById('param-sheet');
  if(el){ el.classList.remove('open'); el.setAttribute('aria-hidden','true'); }
  document.body.classList.remove('sheet-open');
  if(!fromHistory){ try{ if(history.state&&history.state.paramSheet) history.back(); }catch(e){} }
  const b=document.getElementById('btn-params');
  if(b&&b.focus){ try{ b.focus({preventScroll:true}); }catch(e){} }
}
/* 恢复默认：参数回到 PARAM_DEFAULTS，受端输配电价 / 基金回到核定值；省份、通道、报价与电量不动。

/* 选中方案下标：统一夹取到合法范围（M11），renderRouteList / renderDetail / 导出报告共用同一口径。 */

/* 价格组成：各项之和即最终价格（comp 与 landed 同口径，见 algo/cost.js）。为 0 的项不列，送端报价始终列出。

const COMP_ITEMS=[['gen','送端报价','var(--chart-gen)'],['originLoss','送端省内网损','var(--chart-origin-loss)'],['send','送出省输电费','var(--chart-send)'],['trans','跨省通道费','var(--chart-trans)'],
  ['reg','区域电网费','var(--chart-reg)'],['loss','网损折价','var(--chart-loss)'],['inLoss','受端上网线损','var(--chart-in-loss)'],['net','受端输配电价','var(--chart-net)'],['fund','基金及附加','var(--chart-fund)'],['cap','容（需）量电费','var(--chart-cap)'],['sysOp','系统运行费','var(--chart-sys-op)']];

      <div class="cmp-item tot"><div class="l">= ${state.includeDstCost===false?'省界价格':'到户价格'}</div><div class="v">${fmt(r.landed,2)}</div><div class="p">100%</div></div>

/* ---------- 可选路线列表 ---------- */
/* 成本阈值内候选（渲染层口径）：网架图路线下拉共用（change:
   grid-map-single-route-and-fixes 抽出）。
   阈值基准取最低落地价（越限方案排在可行方案之后，首条不一定最低）；返回 [{r,i}]，i=原候选下标。 */
function routeThresholdItems(res){
  const rows=res&&res.rows?res.rows:[];
  if(!rows.length) return [];
  const bestPrice=Math.min(...rows.map(x=>x.landed));
  const thr=bestPrice+Math.abs(bestPrice)*(state.degrade??0.10);
  return rows.map((r,i)=>({r,i})).filter(it=>it.r.landed<=thr);
}
/* 实际展示集合：「展开全部」时为全部候选，否则为阈值内集合。 */
function routeMenuItems(res){
  const rows=res&&res.rows?res.rows:[];
  return state.showAll?rows.map((r,i)=>({r,i})):routeThresholdItems(res);
}
/* 路线下拉选项文案（网架图）：序号 + 途经（区域口径，与测算页卡片同源 routeStops，
   进入区域共用网络只写「X区域」与物理落点，不逐省列名）+ 落地价，首条标注「推荐」 */
function routeOptLabel(it){
  return '#'+(it.i+1)+(it.i===0?' 推荐':'')+' · '+routeStops(it.r).map(s=>s.name+(s.landing?'（落点'+s.landing+'）':'')).join('→')+' · '+fmt(it.r.landed,0)+' 元/MWh';
}
const RLIMIT=18;

      <span>按价格从低到高</span>
      <label class="tg"><input type="checkbox" ${state.showBad?'checked':''} onchange="state.showBad=this.checked;state.sel=0;doSolve()"> 含越限</label>

/* ---------- 通道：按通道优选方案（顶部主卡） ----------
   语义：选中的通道必须出现在方案里（不区分行进方向，方向由通道自身的 bidir 决定）。
   候选清单来自绕行度筛选后的完整候选集，所以选中一条后其余通道仍然可选、可取消。
   每个通道标注「经过它的参考未越限方案中的最低价」，同组内按此价升序，便于直接按通道比价。 */
const _chanBest=new WeakMap();
function channelBest(res){
  if(_chanBest.has(res)) return _chanBest.get(res);
  // 已选组件时 res.rows 只含筛出的方案，最低价须按全量候选另算一次（按结果对象缓存，切方案不重算）
  const full=(res.mustHave||[]).length?solve(Object.assign(solveInput(),{mustHave:[]}),algoData()):res;
  let best=full.channelBest;
  if(!best){ best={}; for(const r of full.rows||[]) if(r.feasible) for(const e of r.edges) if(best[e.id]==null||r.landed<best[e.id]) best[e.id]=r.landed; }
  _chanBest.set(res,best);
  return best;
}
/* 通道单选下拉：原生 select 在安卓 / iOS 上弹系统选择器，只占一行。
   多选（必须同时经过多条通道）实际很少用到，界面只提供单选；算法层 mustHave 仍是数组，兼容多选。 */
function renderChannelSelect(res){
  const list=res.availChannels||[];
  if(!list.length) return '';
  const cur=(res.mustHave||[])[0]||'', best=channelBest(res);
  const isDc=c=>c.type==='DC'||c.type==='AC/DC';
  const byPrice=(a,b)=>(best[a.id]??Infinity)-(best[b.id]??Infinity)||b.count-a.count;
  const opt=c=>`<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>${esc(c.n)} · ${best[c.id]!=null?fmt(best[c.id],0):'无未越限方案'}</option>`;
  const dc=list.filter(isDc).sort(byPrice), ac=list.filter(c=>!isDc(c)).sort(byPrice);
  return `<div class="pk-col chan">
    <div class="pk-lb">通道 · 按经过该通道的最低价排序</div>
    <select id="i-chan"${cur?' class="on"':''}>
      <option value="" ${cur?'':'selected'}>全部通道（不限）</option>
      ${dc.length?`<optgroup label="直流 / 专项工程（${dc.length}）">${dc.map(opt).join('')}</optgroup>`:''}
      ${ac.length?`<optgroup label="交流联络线（${ac.length}）">${ac.map(opt).join('')}</optgroup>`:''}
    </select>
  </div>`;
}
/* 求解当前状态。界面只提供单选通道；换省对后已选通道不在候选里时自动取消，避免筛成空结果。 */
function solveState(){
  if(state.mapFocusLL) state.mapFocusLL=null;   // 批次 B：任何重算让位搜索聚焦（聚焦只由搜索触发）
  if(state.mapView) state.mapView=null;         // grid-map-device-fixes D2：参数/起止省变化复位用户触摸视野
  if((state.mustHave||[]).length>1) state.mustHave=state.mustHave.slice(0,1);
  // M13/M9：boot.js 的主体/档位分支只写入非空自动值；结构特殊的主体（深圳）在这里回到「缺项须手填」，
  // 避免静默沿用上一个主体的输配电价。手改值（pNetManual/fundManual）不受影响。
  syncDstAuto();
  let res=solve(solveInput(), algoData());
  const avail=new Set((res.availChannels||[]).map(c=>c.id));
  if(avail.size && (state.mustHave||[]).some(id=>!avail.has(id))){
    state.mustHave=state.mustHave.filter(id=>avail.has(id));
    res=solve(solveInput(), algoData());
  }
  return res;
}
function clearChannel(){ state.mustHave=[]; state.sel=0; doSolve(); }

/* ---------- 选中路线详情 ---------- */
/* 连续的区域内共用交流接口仅在展示层合并；不改动计价路径、容量链或区域计费位置。 */
function sharedRegionOf(s){
  const region=REGION_OF[s.a];
  return s.e.regional && s.e.type==='AC' && region && region===REGION_OF[s.b]?region:null;
}
function routeDisplayBlocks(r){
  const blocks=[];
  r.segs.forEach((s,i)=>{
    const region=sharedRegionOf(s),last=blocks[blocks.length-1];
    if(region && last?.region===region) last.end=i;
    else blocks.push({start:i,end:i,region});
  });
  return blocks;
}
/* 路线的展示站点：进入区域共用网络时只写「X区域」与物理落点（前一段专项工程的受端），
   不列区域内经过的省份——区域内电能按网架潮流分布，未必经过这些省。
   例：新疆 →吉泉直流→ 安徽 →华东交流→ 江苏 → 上海，显示为「新疆 → 华东区域」、落点安徽。仅影响展示。 */
function routeStops(r){
  const stops=[{name:N(r.nodes[0])}];
  for(const b of routeDisplayBlocks(r)){
    if(!b.region){ stops.push({name:N(r.nodes[b.end+1])}); continue; }
    const landing=stops.length>1 && !stops[stops.length-1].region ? stops.pop().name : null;
    if(stops[stops.length-1].region===b.region) continue;   // 经背靠背等衔接后仍在同一区域，合并
    stops.push({name:b.region+'区域',region:b.region,landing});
  }
  return stops;
}
/* 路线卡片标题：方案的核心通道（专项工程 / 直流），区域网架内的联络线不作标题；全程只走区域网架时写区域名 */
function routeLead(r){
  const own=routeDisplayBlocks(r).filter(b=>!b.region).map(b=>r.edges[b.start]);
  const main=own.find(e=>e.type==='DC')||own[0];
  if(main) return own.length>1?main.n+' 等 '+own.length+' 条':main.n;
  const regs=[...new Set(routeDisplayBlocks(r).map(b=>b.region))];
  return regs.join('、')+'区域网架';
}
/* 路线卡片的途经摘要：中间站点 + 末尾区域（末尾是省份时即受端，不重复写）。 */
function routeVia(r){
  const mid=routeStops(r).slice(1).filter((s,i,a)=>s.region||i<a.length-1);
  return mid.length?'经'+mid.map(s=>s.name+(s.landing?'（落点'+s.landing+'）':'')).join('→'):'';
}
function renderRouteNode(r,i){
  const nd=r.nodes[i];
  const isEnd=i===0||i===r.nodes.length-1;
  const stationAt=(e,code)=>e[e.from===code?'stFrom':'stTo'];
  const stUse=i===0?stationAt(r.edges[0],nd):i===r.edges.length?stationAt(r.edges[i-1],nd):(stationAt(r.edges[i],nd)||stationAt(r.edges[i-1],nd));
  return `<div class="tl-node ${isEnd?'end':''}">
    <div class="tl-dot"></div>
    <div class="tl-info">
      <div class="tl-name">${esc(N(nd))}${isEnd?`<span class="pill">${i===0?'送端':'受端'}</span>`:''}</div>
      ${stUse?`<div class="tl-st">${esc(stName(stUse))}<span class="tl-ad">@ ${esc(stAddr(stUse))}</span></div>`
        :(isEnd?`<div class="tl-st" style="color:var(--ink3)">落点站点待补</div>`:'')}
    </div>
  </div>`;
}
/* 方案里「自有」的通道段：区域共用网络内的交流接口只是连通抽象，电能未必经过，不单列、不据此告警或计段数 */
function ownEdges(r){ return routeDisplayBlocks(r).filter(b=>!b.region).map(b=>r.edges[b.start]); }
function renderRouteSegment(r,i){

        <div class="tl-cap">占用 <b>${fmt(s.util*100,1)}%</b>　剩余 ${fmt(s.headroom,0)} / ${e.cap} MW</div>`

      ${e.regional?`<details class="explain"><summary>计费说明</summary><div class="inner"><p class="note">${e.tariffStatus==='unknown'?'独立输电价待核，当前未计此项；':'区域共用网络接口，不逐个收通道费；'}${i===0?'送出省费用只在交易起点计一次。':'不收过境省外送费。'}${e.type==='AC' && s.billLossPct===0?'计费损耗 0，物理损耗仅作容量估算。':'背靠背损耗为估算，须核对备案标准。'}</p></div></details>`:''}
      <div class="tl-src">${tierTag(e.tier)} ${esc(e.doc||'无发改委文号')}${e.eff?'　<span style="white-space:nowrap">生效 '+esc(e.eff)+'</span>':''}</div>

function renderRegionalCharge(r,region){
  const item=r.regionItems?.find(x=>x.region===region);
  const rate=Number.isFinite(RG[region])?(item?.rate ?? RG[region]*1000):null;
  const hasLoss=item && item.status!=='missing';
  const lossStatus=!item?'区域费开关关闭时，区域网损也排除。':!hasLoss?'未计入不代表已核定为 0%。'
    :item.status==='historical'?'第三监管周期参考值，当前适用性待核实。'
    :item.status==='custom'?'用户手填假设，待核实。':'使用已核实的区域参数。';
  const lossTag=!item||!hasLoss?'':item.status==='historical'?'第三周期参考':item.status==='custom'?'手填':'已核实';
  return `<div class="region-charge" id="region-charge-${esc(region)}" data-region="${esc(region)}">
    <div class="region-charge-hd"><b>区域计费</b><span class="pill ${item?'':'g'}">${item?(rate!=null?'全路径合并计 1 次':'区域电量价缺项'):'本情景未计入'}</span></div>

      <div><span>区域网损</span><b>${!item?'—':hasLoss?fmt(item.pct,2):'未计入'}</b>${hasLoss?`<small>%</small><em>${lossTag}</em>`:''}</div>
    </div>
    ${rate==null?'<p class="region-charge-note">本区域电量价未收录，当前未计入该项，不代表免费。</p>':''}
    <details class="explain"><summary>计费说明</summary><div class="inner">
      <p class="note">${lossStatus}${hasLoss?' 本次区域计费损耗 '+fmt(item.lossMwh,2)+' MWh，已纳入总损耗。':''}</p>
      <p class="note">电量价不含线损；折合费用按本次区域出口电量计算。收费范围以当前测算情景为准，须按交易公告确认。</p>
    </div></details>
  </div>`;

function renderRouteTimeline(r){
  const blocks=routeDisplayBlocks(r),shownRegions=new Set();
  const regionCount=new Set(blocks.filter(b=>b.region).map(b=>b.region)).size;
  const ownCount=blocks.filter(b=>!b.region).length;
  let out=`<div class="card route-timeline">
    <div class="sec-title">交易连接与区域计费<span class="hint">${ownCount?ownCount+' 段通道':''}${ownCount&&regionCount?' · ':''}${regionCount?regionCount+' 个区域网架':''}</span></div>
    <details class="explain"><summary>图示说明</summary><div class="inner">
      <p class="note">展示交易连接关系与计费归属。区域网架内电能按实际潮流分布，不列区域内的联络线和经过的省份。</p>
      <p class="note">区域网架不按联络线逐条计费、计损；区域费与所选区域网损统一归集。容量与功率仅作估算参考，当期可交易性及可用输电容量（ATC）待确认。区域内联络线的参考数据保留在「完整明细」的逐段溯源中。</p>
      ${r.segs.some(s=>s.kmEst)?'<p class="note">* 参考长度按站点直线距离估算，实际路径长度待补。</p>':''}
    </div></details>
    <div class="tl">`;
  for(const block of blocks){
    out+=renderRouteNode(r,block.start);
    if(!block.region){ out+=renderRouteSegment(r,block.start);continue; }
    const {region,start,end}=block,segs=r.segs.slice(start,end+1);
    const charge=shownRegions.has(region)
      ?`<p class="region-charge-note">已合并至<a href="#region-charge-${esc(region)}">${esc(region)}区域计费</a>，本处不重复归集。</p>`
      :renderRegionalCharge(r,region);
    shownRegions.add(region);
    const exceeds=segs.some(s=>s.util>1);
    out+=`<div class="tl-seg region-seg"><div class="tl-seg-line"></div><div class="region-network" data-region="${esc(region)}">
      <div class="region-network-hd"><h3>${esc(region)}区域共用网络</h3><span class="pill g">交易连接示意</span></div>
      <div class="region-connection"><span><b>${esc(N(r.nodes[start]))}</b><small>区域接入</small></span><i aria-hidden="true">↔</i><strong>${esc(region)}区域网架</strong><i aria-hidden="true">↔</i><span><b>${esc(N(r.nodes[end+1]))}</b><small>${end===r.segs.length-1?'节点交付':'网架转接'}</small></span></div>
      ${charge}
      ${exceeds?'<p class="region-capacity exceeded">区域网架参考容量存在越限，详见「完整明细」逐段溯源。</p>':''}
    </div></div>`;
  }
  out+=renderRouteNode(r,r.nodes.length-1)+'</div>';
  // 背靠背、跨区域接口或公告要求的受端区域可能没有区域内交流区块；仍展示求解器已计入的区域费。
  for(const item of r.regionItems||[]){
    if(shownRegions.has(item.region)) continue;
    out+=`<div class="region-network region-settlement"><div class="region-network-hd"><h3>${esc(item.region)}区域计费</h3><span class="pill g">当前情景适用区域</span></div>${renderRegionalCharge(r,item.region)}</div>`;
    shownRegions.add(item.region);
  }
  return out+'</div>';
}

/* ---------- REQ-403 价差敏感性：对当前省对按送端报价扫描 ---------- */
/* 扫描要重算 36 次 solve()；跳数放宽到 MAX_HOPS 后单次可达数十毫秒，故只在展开折叠卡时计算，
   避免每次重渲染（切方案、改参数）都付出这笔开销。重渲染后若面板恢复为展开，toggle 事件会再次触发填充。 */
const SENS_P0=100, SENS_P1=800, SENS_STEP=20;
function renderSensitivity(res){
  if(!res||!res.rows) return '';
  return `<details class="adv boxed" id="d-sens" ontoggle="if(this.open)fillSensitivity(this)"><summary>价差敏感性</summary><div class="inner"></div></details>`;
}
function fillSensitivity(el){
  const box=el.querySelector('.inner');
  if(box && !box.dataset.done){ box.innerHTML=sensitivityTable(); box.dataset.done='1'; }
}
function sensitivityTable(){
  const P0=SENS_P0,P1=SENS_P1,STEP=SENS_STEP; let prev=null; const rowsA=[];
  for(let p=P0;p<=P1;p+=STEP){
    const R=solve(Object.assign(solveInput(),{pGen:p}), algoData());
    const best=R.err?null:(R.bestA||R.rows[0]||null);
    const flip=!!(best&&prev&&(prev.nodes.join('>')!==best.nodes.join('>')||prev.edges.map(e=>e.id).join(',')!==best.edges.map(e=>e.id).join(',')));
    rowsA.push({p,best,flip});
    if(best) prev=best;
  }
  const trs=rowsA.map(pt=>`<tr${pt.flip?' style="background:var(--amber-bg)"':''}>
    <td>${pt.p}</td>
    <td>${pt.best?esc(pt.best.edges.map(e=>e.n).join(' + ')):'—'}</td>
    <td>${pt.best?fmt(pt.best.landed):'—'}</td>
    <td>${pt.best?fmt(pt.best.channelOnly):'—'}</td>
    <td>${pt.flip?'★ 最优切换':''}</td></tr>`).join('');
  return `<p class="note" style="margin:0 0 8px">送端报价 ${P0}~${P1} 元/MWh 扫描（步长 ${STEP}），★ 为最优路线切换点。</p>
    <table><tr><th>送端报价 元/MWh</th><th>最优路线（口径一）</th><th>落地成本</th><th>过网费</th><th>翻转</th></tr>${trs}</table>
    <p class="note">纯前端复用 solve() 重算；金额为对应送端报价下的口径一最优方案。切换点表示该价格档起另一条路线成为最优。</p>`;
}

/* ---------- FR-1（PRD-体验问题修复）：输入钳制与红框红字反馈 ----------
   sanNum（format.js）只管数值；这里负责界面反馈：越限时输入框红框 + 输入框下方红字，
   修正后消失。越限状态显式记入 _clampBad（而不是重绘后按当前值重判——重绘后输入框
   已是钳制值，重判永远"合法"，提示会被自己擦掉），renderCalc 整块重绘后重放。 */
const _clampBad={};
function clampApply(el,entry){
  if(!el) return;
  el.classList.toggle('clamp-bad',!!entry);
  const box=el.parentElement;
  let hint=box?box.querySelector('.clamp-hint'):null;
  if(entry){
    if(!hint&&box){ hint=document.createElement('div'); hint.className='clamp-hint'; box.appendChild(hint); }
    if(hint) hint.textContent='超出上限，已按 '+sanNum(entry.n,entry.lim)+' 计算';
  } else if(hint) hint.remove();
}
function clampRegister(el,raw,lim){
  if(!el) return;
  const s=String(raw==null?'':raw).trim();
  const n=Number(s);
  const bad=s!==''&&Number.isFinite(n)&&n>lim.max;   // PRD 只定义上限钳制，红字仅报超上限
  if(bad) _clampBad[el.id]={lim,n}; else delete _clampBad[el.id];
  clampApply(el,bad?{lim,n}:null);
}
/* 读输入框并按业务上限钳制；nonNeg=true 时沿用旧口径：0/负数回落默认值（B-02/B-03 行为锁） */
function readSan(g,id,lim,nonNeg){
  const el=g(id); if(!el) return lim.fallback;
  let v=sanNum(el.value,lim);
  if(nonNeg&&!(v>0)) v=lim.fallback;
  clampRegister(el,el.value,lim);
  return v;
}
function reapplyClampMarks(){
  for(const id of Object.keys(_clampBad)) clampApply(document.getElementById(id),_clampBad[id]);
}

function doSolve(){
  readInputs(); state._res=solveState();
  const n=state._res.rows?state._res.rows.length:0;
  if(state.sel>=n) state.sel=0;
  saveLast(); renderCalc();
}
function readInputs(){
  const g=id=>document.getElementById(id);
  if(!g('i-from')) return;
  state.from=g('i-from').value; state.to=g('i-to').value;
  // FR-1：数值输入按业务上限钳制（NUM_LIMITS），超上限红框红字提示，state 只存钳制后值；
  // 电量/时长维持旧口径 0/负数回落默认值（nonNeg）
  state.qty=readSan(g,'i-qty',NUM_LIMITS.qty,true);
  state.hours=readSan(g,'i-hours',NUM_LIMITS.hours,true);
  state.pGen=readSan(g,'i-pgen',NUM_LIMITS.quote);
  // 受端输配电价 / 基金及附加只在「到户已列费用」口径下渲染；按渲染时的口径决定是否读取，未渲染时保留预填值
  if(state.includeDstCost!==false){
    const pn=g('i-pnet'), fd=g('i-fund'), lf=g('i-dstlf'), so=g('i-dstsysop');
    // 空输入 = 缺项（保留 null，不静默按 0）；M13：与自动带入值一致视为预填、与 state 不同视为手改并持久化标记。
    // FR-1：数值按业务上限钳制（sanNum），超上限红框红字由 clampRegister 负责
    const read=el=>{ const raw=String(el.value??'').trim(); return (raw===''||!Number.isFinite(+raw))?null:+raw; };
    if(pn){
      const raw=read(pn), nv=raw==null?null:sanNum(raw,NUM_LIMITS.quote), auto=dstAutoNet();
      clampRegister(pn,pn.value,NUM_LIMITS.quote);
      if(nv!=null && auto!=null && Math.abs(nv-auto)<1e-9) state.pNetManual=false;
      else if(!(nv==null && state.pNet==null) && nv!==state.pNet) state.pNetManual=true;
      state.pNet=nv;
    }
    if(fd){
      const raw=read(fd), nv=raw==null?null:sanNum(raw,NUM_LIMITS.quote), auto=dstAutoFund();
      clampRegister(fd,fd.value,NUM_LIMITS.quote);
      if(nv!=null && auto!=null && Math.abs(nv-auto)<1e-9) state.fundManual=false;
      else if(!(nv==null && state.fund==null) && nv!==state.fund) state.fundManual=true;
      state.fund=nv==null?0:nv;
    }
    const num=el=>{ const v=String(el.value??'').trim(); return v===''||!Number.isFinite(+v)||+v<0?null:+v; };
    if(lf && state.dstCapMode && state.dstCapMode!=='none'){ const v=num(lf); state.dstLoadFactor=v!=null&&v>0&&v<=100?v:null; }
    if(so){ const s=String(so.value??'').trim(); state.dstSysOpFee=s===''||!Number.isFinite(+s)?null:sanNum(so.value,NUM_LIMITS.quote); clampRegister(so,so.value,NUM_LIMITS.quote); }
  }
  state.lossBearer=+g('i-bearer').value;
  state.includeRegion=g('i-region').value==='1';
  state.sourceQuote=g('i-sourcequote')?.value||state.sourceQuote;
  state.originLossMode=g('i-originloss')?.value||state.originLossMode;
  state.regionChargeMode=g('i-regioncharge')?.value||state.regionChargeMode;
  state.regionLossMode=g('i-regionloss')?.value||state.regionLossMode||'exclude';
  state.regionLossRates=state.regionLossRates||{};
  for(const k of Object.keys(DATA.RLOSS||{})){
    const el=g('i-rloss-'+k);
    if(el){ const s=el.value.trim(); state.regionLossRates[k]=s===''?null:sanNum(s,NUM_LIMITS.pct); if(s!=='') clampRegister(el,el.value,NUM_LIMITS.pct); }
  }
  state.includeDstCost=g('i-dstcost').value==='1';
  state.tradableOnly=g('i-tradable')?.value==='1';   // REQ-203
  const _o=+g('i-zyocc')?.value||0;                  // REQ-302（百分比维持现有 0~90 钳制）
  state.occPct=Math.min(90,Math.max(0,_o));
}
/* 送端省变化：只影响送端报价。手填值保留；其余情况按该省演示参考值重新预填。
   M12：state.js 加载存档时把任何存档 pGen 一律推断为「手填」，存档往返后切省不再预填、且无法解开。
   这里用 _pgenAutoProv（上次自动预填的省）区分真手填：当前值仍等于上次自动预填值（或本省参考值）时
   视为预填而非手填，重新带入新省参考值；真正手填过的值不受影响。 */
function applyFromProv(){
  const f=PV[state.from];
  if(!f) return;
  const eq=(a,b)=>a!=null&&b!=null&&Math.abs(+a-+b)<1e-9;
  const prev=state._pgenAutoProv?PV[state._pgenAutoProv]:null;
  const looksAuto=!state.pGenManual || (!state._pgenAutoProv ? eq(state.pGen,f.clear) : eq(state.pGen,prev&&prev.clear));
  if(looksAuto && f.clear!=null){ state.pGen=f.clear; state.pGenManual=false; }
  state._pgenAutoProv=state.from;
}
/* 受端省网输配电价与基金及附加的自动带入同步。
   M13：手改标记（pNetManual / fundManual）随存档持久化，启动时不再无条件覆盖用户手改值；
   手改值等于自动带入值（含 boot.js 换算档后写入新档位值的情形）时撤销标记，避免误判为手填。
   M9：结构特殊的深圳电网不自动带入输配电价（返回 null = 缺项），须手填，不静默沿用其它主体值。 */
function syncDstAuto(){
  const t=PV[state.to]; if(!t) return;
  const autoNet=dstAutoNet(), autoFund=dstAutoFund();
  if(state.pNetManual && autoNet!=null && state.pNet!=null && Math.abs(+state.pNet-autoNet)<1e-9) state.pNetManual=false;
  if(state.fundManual && autoFund!=null && state.fund!=null && Math.abs(+state.fund-autoFund)<1e-9) state.fundManual=false;
  if(!state.pNetManual) state.pNet=autoNet;
  if(!state.fundManual){ state.fundMissing=(autoFund==null); state.fund=autoFund==null?0:autoFund; }
}
/* 受端省变化：影响受端省网输配电价、政府性基金及附加。换省视为重新核准，手改标记一并清除（旧行为不变）；
   启动时同一省份（_pnetProv 未变）则保留手改值（M13）。 */
function applyToProv(){
  const t=PV[state.to];
  if(!t) return;
  if(state._pnetProv!==state.to){ state.pNetManual=false; state.fundManual=false; }
  state._pnetProv=state.to;
  syncDstAuto();
}
function applyBothProv(){ applyFromProv(); applyToProv(); }
/* 把某一项恢复为当前受端省的核定值（结构特殊的主体回到「缺项须手填」状态） */
function resetOne(k){
  const t=PV[state.to];
  if(!t) return;
  if(k==='pNet'){ state.pNetManual=false; state.pNet=dstAutoNet(); }
  if(k==='fund'){ state.fundManual=false; state.fundMissing=(dstAutoFund()==null); state.fund=dstAutoFund()??0; }
  state._res=solveState(); saveLast(); renderCalc();
}

/* ---------- REQ-401 容量电费测算器（独立折叠卡，不参与路径比选） ---------- */
/* 默认预选档口径：优先「1~10（20）千伏」档；该省无此档别的取表内最低电压档（第一档）。 */
function capProv(){ return (state.capProv&&PV[state.capProv])?state.capProv:state.to; }
function capTiers(p){ const e=CAP[p]; return (e&&e.需量电价)?e.需量电价:[]; }
function capDefaultTier(tiers){ return tiers.find(t=>/1~10（20）/.test(t.档别))||tiers[0]||null; }
function capTier(p){
  const tiers=capTiers(p);
  if(!tiers.length) return null;
  return tiers.find(t=>t.档别===state.capTier)||capDefaultTier(tiers);
}
function setCapMode(m){ state.capMode=m; saveLast(); renderCalc(); }
function renderCapFee(){

    inner=`

      </select></label>
      <label class="f"><span>电压档（默认预选项 = 1~10（20）千伏档，无此档取第一档）</span><select id="i-captier">
        ${tiers.map(t=>`<option value="${esc(t.档别)}" ${tier&&t.档别===tier.档别?'selected':''}>${esc(t.档别)}</option>`).join('')}
      </select></label>
    </div>
    <div class="sub">计费方式<em>二选一，互斥切换</em></div>
    <div class="seg">
      <button class="${isCap?'on':''}" onclick="setCapMode('cap')">按容量 kVA</button>
      <button class="${!isCap?'on':''}" onclick="setCapMode('demand')">按需量 kW</button>
    </div>
    <div class="row2">
      <label class="f"><span>${modeLbl} ${unit}</span><input id="i-capval" type="number" value="${state.capValue}" step="10" min="0"></label>
      <label class="f"><span>年用电量 MWh</span><input id="i-capqty" type="number" value="${state.capQty}" step="100" min="0"></label>
    </div>
    <div class="g3" style="margin-top:2px">
      <div class="mc"><div class="l">所选档单价</div><div class="v">${price!=null?fmt(price):'—'}<small>${priceUnit}</small></div></div>
      <div class="mc"><div class="l">年容量电费</div><div class="v" ${annual!=null?`title="完整值 ${num(annual)} 元/年"`:''}>${annual!=null?fmtCompact(annual):'—'}<small>元/年</small></div></div>
      <div class="mc"><div class="l">度电分摊额</div><div class="v" ${per!=null?`title="完整值 ${fmt(per,2)} 元/MWh"`:''}>${per!=null?fmtCompact(per,2):'—'}<small>元/MWh</small></div></div>
    </div>
    ${tier?`<details class="explain"><summary>本省全部电压档单价<em>1077号附件1</em></summary><div class="inner">
      <table><tr><th>档别</th><th>容量电价<br>元/千伏安·月</th><th>需量电价<br>元/千瓦·月</th></tr>
      ${(entry.容量电价||[]).map(t=>{
        const dm=(entry.需量电价||[]).find(x=>x.档别===t.档别);
        const cur=tier&&t.档别===tier.档别;
        return `<tr${cur?' style="background:var(--blue-bg)"':''}><td>${esc(t.档别)}${cur?'　<b>当前</b>':''}</td><td>${t.价!=null?fmt(t.价):'—'}</td><td>${dm&&dm.价!=null?fmt(dm.价):'—'}</td></tr>`;
      }).join('')}</table>
      <p class="note">数据同费率库「容量/需量电价」分区；测算取当前所选档，其余档别供核对。</p>
    </div></details>`:''}
    ${qty<=0?'<p class="note">年用电量为 0，度电分摊额不计算（显示 —）。</p>':''}
    <div class="lib-src" style="margin-top:8px">当前取值依据：${esc(entry.省)} · ${esc(tier?tier.档别:'—')} · ${modeLbl}　${esc(entry.来源)}</div>`;
  }
  return `<details class="adv boxed" id="d-capfee"><summary>容量电费测算<span style="font-weight:400;color:var(--ink3);font-size:11px;margin-left:6px">算一笔容量电费的独立小工具</span></summary><div class="inner">

  </div></details>`;
}

function renderRegionComparison(r){
