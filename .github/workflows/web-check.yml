name: web-check
# Web 侧持续集成：三套纯 Node 验证 + 构建产物同步校验。
# 每次推送都跑（无 paths 过滤，本工作流就是全仓库防线）；本机验证过的四步
# （模块测试 / 回归基线 / 双端数据 / 构建后 diff）在 CI 原样复跑。
on:
  workflow_dispatch:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本留档
        run: node --version

      # 防换行假阳性：产物 diff 校验对字节敏感，固定 LF 口径
      - name: 固定换行口径
        run: git config core.autocrlf false

      - name: 算法模块测试
        run: node tools/test-modules.mjs

      - name: 回归基线校验（以实跑输出为准）
        run: node tools/baseline-check.mjs

      - name: 双端数据一致性
        run: node tools/test-data-share.mjs

      # 设计令牌守卫：颜色 / 圆角字面值只在 src/tokens.css、令牌引用有定义、字号在允许集合内、三套主题对比度达标
      - name: 设计令牌守卫
        run: node tools/test-design-tokens.mjs

      - name: 重新构建
        run: node tools/build.mjs

      # 产物同步校验：对「已提交版本」与「当前源码重建版本」用同一管道归一化两侧时间戳
      # （index.html 的 BUILD_TIME + shared/*.json 的 builtAt），再逐文件比对——
      # 只归一化单侧会让 git diff 永远显示时间戳差异（首跑踩过的坑）
      - name: 产物同步校验（剔除构建时间戳）
        run: |
          norm() { sed -E "s/const BUILD_TIME='[^']*'/const BUILD_TIME=''/; s/\"builtAt\": ?\"[^\"]*\"/\"builtAt\": \"\"/" "$@"; }
          fail=0
          for f in index.html shared/app-data.json shared/app-data.min.json; do
            echo "比对 $f …"
            if ! diff <(git show HEAD:"$f" | norm) <(norm "$f"); then
              echo "::error::$f 与当前源码的构建产物不同步——改了源码/数据后忘记重新构建？"
              fail=1
            fi
          done
          exit $fail
