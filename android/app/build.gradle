plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iproute.calc'
    compileSdk 34

    defaultConfig {
        applicationId "com.iproute.calc"
        minSdk 26          // 自适应图标 (adaptive icon) 需要 API 26+，覆盖 Android 8.0 (2017) 以上设备
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 内部试用先用 debug 签名分发；正式发布时再配置 release 签名
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
