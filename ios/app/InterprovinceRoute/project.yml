# xcodegen 兜底配置：若手写的 project.pbxproj 在 Xcode 打不开，
# 在本目录执行 `xcodegen generate` 即可由本文件重新生成等价工程。
# 仅 Mac 端可用（brew install xcodegen）。
name: InterprovinceRoute
options:
  bundleIdPrefix: com.chenshi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  InterprovinceRoute:
    type: application
    platform: iOS
    sources:
      - path: InterprovinceRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenshi.iproute
        INFOPLIST_KEY_CFBundleDisplayName: 省间路径优选
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleShortVersionString: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
